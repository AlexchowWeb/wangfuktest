<!doctype html><html lang="zh-Hant"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>宏福苑大火全紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --paper:#f6f3ec; --paper-raised:#ffffff; --ink:#1c1a15; --ink-dim:#5c5646; --ink-faint:#8d8672;
  --rule:#ddd6c4; --rule-strong:#c3baa2; --accent:#b5232a; --accent-dim:#e7b9ba; --accent-ink:#ffffff;
  --blue:#2b5a86; --green:#2f6b4f; --purple:#6a4f8c; --amber:#a3691b;
  --font-display:'Noto Serif TC','Noto Serif',serif;
  --font-body:'Noto Sans TC','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#17150f; --paper-raised:#211e15; --ink:#ece6d6; --ink-dim:#b7ae97; --ink-faint:#847c67; --rule:#332f22; --rule-strong:#464031; --accent:#e2585c; --accent-dim:#4a2426; --accent-ink:#1a0a0a; --blue:#7ba7d6; --green:#7fbf9c; --purple:#b49bdc; --amber:#e0a94f; }
}
:root[data-theme="dark"]{ --paper:#17150f; --paper-raised:#211e15; --ink:#ece6d6; --ink-dim:#b7ae97; --ink-faint:#847c67; --rule:#332f22; --rule-strong:#464031; --accent:#e2585c; --accent-dim:#4a2426; --accent-ink:#1a0a0a; --blue:#7ba7d6; --green:#7fbf9c; --purple:#b49bdc; --amber:#e0a94f; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
body.mode-3d{overflow:hidden;height:100vh;background:#0b0f19;color:#f3f4f6;}
h1,h2,h3,.font-display{font-family:var(--font-display);text-wrap:balance;}
.tabular,.font-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.wrap{max-width:760px;margin:0 auto;padding:0 1.5rem;}
.wrap-wide{max-width:1040px;margin:0 auto;padding:0 1.5rem;}
a{color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:4px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}
.icon-inline{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex-shrink:0;}
.hidden{display:none!important;}

/* ---- editorial nav ---- */
#site-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);}
#site-nav .bar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.wordmark{display:flex;align-items:baseline;gap:.5rem;text-decoration:none;color:var(--ink);}
.wordmark .zh{font-family:var(--font-display);font-weight:900;font-size:1.05rem;letter-spacing:.02em;color:var(--accent);}
.wordmark .en{font-size:.6rem;letter-spacing:.16em;color:var(--ink-faint);font-weight:600;}
.nav-links{display:none;gap:1.5rem;font-size:.8rem;color:var(--ink-dim);}
@media(min-width:768px){.nav-links{display:flex;}}
.nav-links a{color:var(--ink-dim);text-decoration:none;}
.nav-links a:hover{color:var(--accent);}
.nav-btn{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.4rem .7rem;border-radius:8px;border:1px solid var(--rule-strong);background:var(--paper-raised);color:var(--ink-dim);cursor:pointer;white-space:nowrap;}
.nav-btn:hover{color:var(--ink);border-color:var(--accent);}
.nav-btn.accent{border-color:var(--accent);color:var(--accent);}

/* ---- kicker / chapter headers ---- */
.kicker{display:flex;align-items:center;gap:.6rem;color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.9rem;}
.kicker::before{content:'';width:22px;height:2px;background:var(--accent);display:block;}
.chapter{padding:3.2rem 0;border-top:1px solid var(--rule);}
.chapter:first-of-type{border-top:none;}
.h1-title{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:900;line-height:1.18;letter-spacing:-.01em;}
.h2-title{font-size:clamp(1.5rem,3.4vw,2.15rem);font-weight:800;line-height:1.22;}
.lede{font-size:1.02rem;line-height:1.85;color:var(--ink-dim);margin-top:1.1rem;}
.byline-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;font-size:.74rem;color:var(--ink-faint);margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--rule);}

.stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:1.8rem;}
@media(min-width:640px){.stat-strip{grid-template-columns:repeat(4,1fr);}}
.stat-cell{background:var(--paper-raised);padding:1rem .9rem;}
.stat-num{font-family:var(--font-mono);font-weight:700;font-size:1.7rem;color:var(--accent);line-height:1;}
.stat-num small{font-size:.95rem;font-weight:600;color:var(--ink-faint);}
.stat-label{font-size:.68rem;color:var(--ink-faint);margin-top:.35rem;line-height:1.4;}

.chart-card{margin-top:1.8rem;border:1px solid var(--rule);border-radius:12px;background:var(--paper-raised);padding:1.2rem 1.3rem 1rem;}
.chart-caption{font-size:.72rem;color:var(--ink-faint);margin-top:.6rem;border-top:1px dashed var(--rule);padding-top:.6rem;}

.story-block{position:relative;padding:1.6rem 0 1.6rem 1.6rem;border-left:2px solid var(--rule-strong);}
.story-block:last-child{border-color:transparent;}
.story-block::before{content:'';position:absolute;left:-6px;top:1.9rem;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);}
.story-block[data-phase="aftermath"]::before{border-color:var(--blue);}
.story-time{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--ink-faint);letter-spacing:.02em;}
.story-title{font-size:1.12rem;font-weight:700;margin-top:.4rem;line-height:1.4;}
.story-desc{font-size:.9rem;line-height:1.75;color:var(--ink-dim);margin-top:.45rem;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
.badge-verified{color:var(--green);border-color:var(--green);background:color-mix(in srgb, var(--green) 10%, transparent);}
.badge-unverified{color:var(--amber);border-color:var(--amber);background:color-mix(in srgb, var(--amber) 10%, transparent);}
.tag-pill{display:inline-block;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;}
.tag-charges{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);}
.tag-inquiry{background:color-mix(in srgb, var(--blue) 14%, transparent);color:var(--blue);}
.tag-policy{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green);}
.tag-press{background:color-mix(in srgb, var(--purple) 14%, transparent);color:var(--purple);}
.tag-human{background:color-mix(in srgb, var(--amber) 14%, transparent);color:var(--amber);}
.source-link{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;margin-top:.55rem;color:var(--ink-faint);text-decoration:none;border-bottom:1px dotted var(--ink-faint);}
.source-link:hover{color:var(--accent);border-color:var(--accent);}

.tower-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-top:1.8rem;}
@media(min-width:640px){.tower-grid{grid-template-columns:repeat(4,1fr);}}
.tower-card{border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);padding:.8rem .85rem;cursor:pointer;transition:border-color .15s,transform .15s;}
.tower-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.tower-card .tid{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-faint);font-weight:700;}
.tower-card .tname{font-size:.82rem;font-weight:700;margin-top:.15rem;line-height:1.3;}
.tower-card .tdeaths{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;margin-top:.4rem;}
.tower-card .tdeaths small{font-size:.65rem;font-weight:600;color:var(--ink-faint);}
.tower-card .tbar{height:4px;border-radius:2px;background:var(--rule);margin-top:.5rem;overflow:hidden;}
.tower-card .tbar i{display:block;height:100%;background:var(--accent);}

.cta-card{margin-top:1.8rem;border:1px solid var(--rule-strong);border-radius:14px;background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, var(--paper-raised)), var(--paper-raised));padding:1.5rem 1.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.cta-card h4{margin:0 0 .3rem;font-size:1.05rem;font-weight:800;}
.cta-card p{margin:0;font-size:.82rem;color:var(--ink-dim);}
.cta-btn{flex-shrink:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;padding:.65rem 1.2rem;border-radius:10px;border:none;cursor:pointer;white-space:nowrap;}
.cta-btn:hover{opacity:.9;}

.fail-list{margin-top:1.2rem;display:flex;flex-direction:column;gap:.9rem;}
.fail-item{display:flex;gap:.8rem;padding:.9rem 1rem;border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);}
.fail-num{font-family:var(--font-mono);font-weight:800;color:var(--accent);font-size:.85rem;flex-shrink:0;}
.fail-title{font-weight:700;font-size:.9rem;}
.fail-desc{font-size:.82rem;color:var(--ink-dim);line-height:1.7;margin-top:.25rem;}
.fail-tower{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-faint);margin-top:.35rem;}

.victim-groups{margin-top:1.8rem;display:grid;grid-template-columns:1fr;gap:.9rem;}
@media(min-width:640px){.victim-groups{grid-template-columns:repeat(2,1fr);}}
.victim-group{border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);}
.victim-group summary{list-style:none;cursor:pointer;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.86rem;}
.victim-group summary::-webkit-details-marker{display:none;}
.victim-group summary .n{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:.8rem;}
.victim-names{padding:0 1rem 1rem;display:flex;flex-wrap:wrap;gap:.4rem;}
.victim-chip{font-size:.78rem;padding:.25rem .6rem;border-radius:999px;background:color-mix(in srgb, var(--accent) 8%, var(--paper));border:1px solid var(--rule);}
.victim-empty{padding:0 1rem 1rem;font-size:.76rem;color:var(--ink-faint);line-height:1.6;}
.victim-note{margin-top:1.4rem;border:1px dashed var(--rule-strong);border-radius:10px;padding:1rem 1.1rem;font-size:.8rem;line-height:1.75;color:var(--ink-dim);background:color-mix(in srgb, var(--amber) 6%, transparent);}

.recap-block{border:1px solid var(--rule);border-radius:12px;background:var(--paper-raised);padding:1.4rem 1.5rem;margin-top:1.4rem;}
.recap-block h3{font-size:1.05rem;font-weight:800;margin:0 0 .5rem;}

footer.site-footer{border-top:1px solid var(--rule);padding:2.4rem 0 3rem;font-size:.78rem;color:var(--ink-faint);}
footer.site-footer h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 .7rem;}
.src-list{display:grid;grid-template-columns:1fr;gap:.4rem .9rem;}
@media(min-width:768px){.src-list{grid-template-columns:1fr 1fr;}}
.src-list a{color:var(--ink-dim);text-decoration:none;font-size:.78rem;line-height:1.5;}
.src-list a:hover{color:var(--accent);text-decoration:underline;}

/* ---- edit modal (shared) ---- */
#edit-modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:2.5rem 1rem;background:rgba(20,18,12,.6);backdrop-filter:blur(3px);overflow-y:auto;}
#edit-modal.open{display:flex;}
.edit-panel{width:100%;max-width:820px;background:var(--paper-raised);border-radius:16px;border:1px solid var(--rule-strong);box-shadow:0 30px 70px rgba(0,0,0,.35);color:var(--ink);}
.edit-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.3rem;border-bottom:1px solid var(--rule);}
.edit-tabs{display:flex;gap:.3rem;padding:.7rem 1.3rem 0;flex-wrap:wrap;}
.edit-tab{font-size:.75rem;font-weight:600;padding:.4rem .75rem;border-radius:8px 8px 0 0;border:1px solid transparent;color:var(--ink-faint);cursor:pointer;}
.edit-tab.active{color:var(--accent);border-color:var(--rule) var(--rule) transparent;background:var(--paper);}
.edit-body{padding:1.1rem 1.3rem 1.3rem;max-height:60vh;overflow-y:auto;}
.ef{margin-bottom:.7rem;}
.ef label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:.3rem;font-weight:600;}
.ef input[type="text"],.ef input[type="number"],.ef input[type="url"],.ef input[type="date"],.ef textarea,.ef select{width:100%;background:var(--paper);border:1px solid var(--rule-strong);border-radius:8px;padding:.5rem .6rem;color:var(--ink);font-size:.8rem;font-family:var(--font-body);}
.ef textarea{resize:vertical;min-height:56px;}
.entry-card{border:1px solid var(--rule);border-radius:10px;padding:.8rem;margin-bottom:.7rem;background:var(--paper);}
.entry-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.mini-btn{font-size:.7rem;font-weight:600;padding:.3rem .6rem;border-radius:6px;border:1px solid var(--rule-strong);background:var(--paper-raised);cursor:pointer;color:var(--ink-dim);}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.edit-foot{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:1rem 1.3rem;border-top:1px solid var(--rule);}
.save-status{font-size:.72rem;color:var(--ink-faint);}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.82rem;padding:.55rem 1.1rem;border-radius:8px;border:none;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--rule-strong);color:var(--ink-dim);font-size:.8rem;padding:.5rem .9rem;border-radius:8px;cursor:pointer;}

/* ============ DASHBOARD (3D reconstruction) PAGE — dark theme, fixed viewport ============ */
#page-3d{position:fixed;inset:0;z-index:1;background:#0b0f19;color:#f3f4f6;font-family:var(--font-body);}
body:not(.mode-3d) #page-3d{display:none;}
body.mode-3d #page-editorial{display:none;}
/* ---- site opening animation ---- */
body.intro-active{overflow:hidden;}
#site-intro{position:fixed;inset:0;z-index:200;background:#f3f2f2;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s ease;}
#site-intro.done{opacity:0;visibility:hidden;pointer-events:none;}
#site-intro-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f3f2f2;}
#site-intro-skip{position:absolute;right:clamp(1rem,3vw,2rem);bottom:clamp(1.4rem,4vh,2.4rem);font:600 .78rem var(--font-body);color:#201e1d;background:rgba(255,255,255,.85);border:1px solid #c3baa2;border-radius:999px;padding:.5rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;}
#site-intro-skip:hover{background:#fff;}
#site-intro-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(32,30,29,.12);}
#site-intro-bar i{display:block;height:100%;width:0;background:#b5232a;}
#dash-canvas-container{touch-action:none;}
/* phones: keep the 3D model visible — tower list is reachable by tapping towers */
@media (max-width:767px){
  .dash-aside-left{display:none!important;}
  .dash-stats-box{display:none!important;}
  .dash-title-box p{display:none;}
  #dash-detail-panel{top:auto!important;bottom:11.5rem;left:1rem;right:1rem;width:auto!important;padding:.8rem!important;}
  #dash-detail-desc{display:none;}
}
#dash-canvas-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:0;}
.dash-glass{background:rgba(17,24,39,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);}
#dash-tower-hover-label{position:fixed;display:none;z-index:30;pointer-events:none;padding:6px 10px;border:1px solid rgba(245,158,11,.7);border-radius:8px;background:rgba(17,24,39,.94);color:#fef3c7;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#dash-interaction-guide{position:fixed;top:5rem;left:50%;transform:translateX(-50%);z-index:30;width:16rem;border-radius:1rem;border:1px solid rgba(75,85,99,.8);background:rgba(3,7,18,.95);padding:.9rem;font-size:.72rem;color:#d1d5db;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);}
#dash-interaction-guide h2{margin:0 0 .5rem;font-size:.8rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.4rem;}
#dash-interaction-guide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45rem;}
#dash-intro-overlay{position:fixed;inset:0;z-index:60;background:#05070d;overflow:hidden;transition:opacity 1s ease,visibility 1s ease;}
#dash-intro-overlay.intro-complete{opacity:0;visibility:hidden;pointer-events:none;}
#dash-intro-video{width:100%;height:100%;object-fit:contain;background:#05070d;}
#dash-intro-overlay::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,13,.85),transparent 22%,transparent 78%,rgba(5,7,13,.7));pointer-events:none;}
#dash-intro-content{position:absolute;left:clamp(1.2rem,5vw,4rem);bottom:clamp(1.2rem,5vh,3rem);z-index:1;max-width:30rem;}
#dash-intro-content h1{font-size:clamp(1.4rem,3.4vw,2.2rem);font-weight:800;color:#fff;line-height:1.25;margin:.5rem 0 0;}
#dash-intro-content p{font-size:.8rem;color:#d1d5db;margin-top:.6rem;line-height:1.6;}
.dash-header{position:absolute;top:1rem;left:1rem;right:1rem;z-index:10;display:flex;flex-direction:column;gap:.75rem;pointer-events:none;}
@media(min-width:768px){.dash-header{flex-direction:row;justify-content:space-between;align-items:center;}}
.dash-title-box{padding:.8rem 1.2rem;border-radius:1rem;pointer-events:auto;border-left:4px solid #ef4444;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);max-width:32rem;}
.dash-title-box h1{margin:0;font-size:1.05rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem;letter-spacing:.02em;}
.dash-title-box p{margin:.2rem 0 0;font-size:.68rem;color:#9ca3af;}
.dash-stats-box{padding:.65rem 1rem;border-radius:1rem;pointer-events:auto;display:flex;align-items:center;gap:1.2rem;font-size:.72rem;color:#d1d5db;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);flex-wrap:wrap;}
.dash-nav-btns{display:flex;gap:.4rem;pointer-events:auto;}
.dash-btn{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;padding:.4rem .65rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.14);background:rgba(17,24,39,.85);color:#e5e7eb;cursor:pointer;white-space:nowrap;}
.dash-btn:hover{color:#fff;border-color:#f59e0b;}
.dash-aside-left{position:absolute;top:6.2rem;left:1rem;z-index:10;width:17.5rem;max-height:calc(100vh - 11rem);overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;}
.dash-panel{padding:1rem;border-radius:1rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);}
.dash-panel h2,.dash-panel h3{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin:0 0 .7rem;display:flex;justify-content:space-between;align-items:center;}
.dash-tower-row{padding:.6rem;border-radius:.75rem;background:rgba(3,7,18,.55);border:1px solid rgba(31,41,55,.9);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s;margin-bottom:.4rem;}
.dash-tower-row:hover{background:rgba(31,41,55,.85);}
.dash-tower-row .name{font-size:.72rem;font-weight:700;color:#e5e7eb;}
.dash-tower-row .sub{font-size:.62rem;color:#9ca3af;margin-top:.1rem;}
.dash-badge{font-size:.6rem;padding:2px 8px;border-radius:6px;font-weight:600;background:#1f2937;color:#9ca3af;white-space:nowrap;}

ld (raw elements/hex/px by design)\n// Copied omelette starter. Re-running copy_starter_component with this kind overwrites this file with the latest version (page content is unaffected).\n\n/* BEGIN USAGE */\n// animations-v3.jsx — continuous-composition animation engine.\n//\n// THE MODEL: the animation is ONE element tree rendered as a pure function\n// of one authored-time axis. Nothing mounts or unmounts at section\n// boundaries, so any element can move, morph, or persist across them by\n// ordinary interpolation. The scene list (OM_SCENES) is the user-control\n// view — names, order, playback durations — and the engine derives the cue\n// table from it, so structure has exactly one source and cannot drift.\n//\n// API INDEX (every export is a window global):\n//   <CompositionStage width height scenes={window.OM_SCENES}\n//                     playback={window.OM_PLAYBACK} bg>\n//     <Piece />   — ONE component, the whole animation\n//   <\/CompositionStage>\n//   useComposition() -> {T, CUES, time, duration, authoredTotal, playing}\n//     T: authored seconds (warped per-section by user trims/speeds) —\n//        key ALL choreography to T, never to wall-clock time\n//     CUES: {SectionName: authoredStart} derived from OM_SCENES; an unknown\n//        name returns NaN and raises a preview-only badge (never exports);\n//        duplicate section names bind to the first occurrence\n//   <Shot from={CUES.Build} to={CUES.Close}> — children visible between two\n//     authored times (an authored hard cut in one line); children stay\n//     mounted (media keeps its readiness) and are hidden outside the window\n//   <Captions items={[{at, until?, text}, ...]} /> — ONE caption element,\n//     at most one visible at a time, keyed to T; 'until' defaults to the\n//     next item's 'at'; a last item with no 'until' stays to the end\n//   WATERCOLOR (only when the Watercolor illustration skill is active —\n//   otherwise ignore these entries). A painting is a function( function svgBarChart(labels, values, opts){
  opts = opts || {};
  var w = 640, h = 180, padL = 28, padB = 34, padT = 10, padR = 10;
  var max = Math.max.apply(null, values) || 1;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  var n = values.length, gap = innerW / n * 0.28;
  var barW = (innerW / n) - gap;
  var bars = '', labelsSvg = '', valuesSvg = '';
  for (var i=0;i<n;i++){
    var bh = Math.max(2, (values[i]/max) * innerH);
    var x = padL + i * (innerW/n) + gap/2;
    var y = padT + innerH - bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--accent)" opacity="'+(opts.opacityFn?opts.opacityFn(values[i],max):0.85)+'"></rect>';
    valuesSvg += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="10" font-family="var(--font-mono)" fill="var(--ink-dim)">'+esc(values[i])+'</text>';
    labelsSvg += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-10).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+esc(labels[i])+'</text>';
  }
  var baseline = '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(w-padR)+'" y2="'+(padT+innerH)+'" stroke="var(--rule-strong)" stroke-width="1"></line>';
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="bar chart" style="width:100%;height:auto;display:block;">'+baseline+bars+valuesSvg+labelsSvg+'</svg>';
}

function renderChapter1(){
  var d = SITE_DATA;
  var totalDeaths = d.towers.reduce(function(s,tw){return s+tw.deaths;},0);
  var chartLabels = d.timelineEvents.map(function(e){ return e.timeStr.split(' ').pop(); });
  var chartValues = d.timelineEvents.map(function(e){
    var c=0; Object.keys(e.towerBurns).forEach(function(k){ if(e.towerBurns[k] > 0.05) c++; }); return c;
  });
  var storyHtml = '';
  d.timelineEvents.forEach(function(e){
    storyHtml += '<div class="story-block" data-phase="fire">'
      + '<span class="story-time">' + esc(e.timeStr) + '</span>'
      + '<div class="story-title">' + esc(tr(e.title)) + '</div>'
      + '<p class="story-desc">' + esc(tr(e.desc)) + '</p>'
      + '</div>';
  });
  var sortedAftermath = d.aftermath.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  sortedAftermath.forEach(function(am){
    var badge = am.verified ? '<span class="badge badge-verified">✓ '+t('verified')+'</span>' : '<span class="badge badge-unverified">△ '+t('unverified')+'</span>';
    var tagLbl = tr(TAG_LABEL[am.tag] || {zh:am.tag,en:am.tag});

      + '<span class="story-time">' + esc(am.date) + '</span> <span class="tag-pill tag-'+esc(am.tag)+'">'+esc(tagLbl)+'</span> ' + badge
      + '<div class="story-title">' + esc(tr(am.title)) + '</div>'
      + '<p class="story-desc">' + esc(tr(am.desc)) + '</p>'
      + '<a class="source-link" href="'+esc(am.sourceUrl)+'" target="_blank" rel="noopener">'+esc(am.sourceLabel)+' →</a>'
      + '</div>';
  });

  +     '<div class="stat-strip">'

  +       '<div class="stat-cell"><div class="stat-num tabular">7<small>/8</small></div><div class="stat-label">'+esc(t('statTowers'))+'</div></div>'

function getPath(obj, path){ return path.split('.').reduce(function(o,k){return o==null?o:o[k];}, obj); }
function setPath(obj, path, val){ var parts = path.split('.'); var o = obj; for (var i=0;i<parts.length-1;i++){ o = o[parts[i]]; } o[parts[parts.length-1]] = val; }
function wireEditPane(tab){
  var body = document.getElementById('edit-body');
  body.querySelectorAll('.entry-card').forEach(function(card){
    var idx = parseInt(card.getAttribute('data-idx'),10);
    card.querySelectorAll('[data-f]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var arr = SITE_DATA[tab];
        var val = inp.type === 'checkbox' ? inp.checked : (inp.type==='number' ? Number(inp.value) : inp.value);
        setPath(arr[idx], inp.getAttribute('data-f'), val);
      });
    });
    var rm = card.querySelector('[data-remove]');
    if (rm) rm.addEventListener('click', function(){ SITE_DATA[tab].splice(idx,1); openEditTab(tab); });
  });
  var addBtn = document.getElementById('add-'+tab);
  if (addBtn) addBtn.addEventListener('click', function(){
    if (tab === 'aftermath') SITE_DATA.aftermath.push({ id:'am'+Date.now(), date:SITE_DATA.meta.lastUpdated, tag:'human', verified:false, title:{zh:'新項目',en:'New entry'}, desc:{zh:'',en:''}, sourceLabel:'', sourceUrl:'' });
    if (tab === 'sources') SITE_DATA.sources.push({ label:'', url:'' });
    if (tab === 'victims') SITE_DATA.victims.push({ name:'', tower: SITE_DATA.towers[0].id });
    openEditTab(tab);
  });
  if (tab === 'victims'){
    var bulkBtn = document.getElementById('victim-bulk-add');
    if (bulkBtn) bulkBtn.addEventListener('click', function(){
      var raw = document.getElementById('victim-bulk').value;
      var validIds = SITE_DATA.towers.map(function(tw){return tw.id;});
      raw.split('\n').forEach(function(line){
        line = line.trim(); if (!line) return;
        var parts = line.split(',');
        var name = (parts[0]||'').trim();
        var tower = (parts[1]||'').trim().toUpperCase();
        if (name && validIds.indexOf(tower) !== -1) SITE_DATA.victims.push({ name:name, tower:tower });
      });
      openEditTab('victims');
    });
  }
}
var currentEditTab = 'towers';
function openEditTab(tab){
  currentEditTab = tab;
  document.querySelectorAll('.edit-tab').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-tab')===tab); });
  document.getElementById('edit-body').innerHTML = renderEditPane(tab);
  wireEditPane(tab);
}

/* ================= DASHBOARD 3D ENGINE (ported from user's original build) ================= */
var DASH = {
  scene:null, camera:null, renderer:null, raycaster:null, mouse:null,
  towerMeshes:{}, scaffoldMeshes:{}, interactiveObjects:[],
  isPlaying:false, playInterval:null, showScaffolding:true, showFireEffects:true, isCinematic:false,
  isMouseDown:false, prevMouse:{x:0,y:0}, cameraTarget:null, cameraRadius:225, cameraTheta:Math.PI/2, cameraPhi:Math.PI/3.5,
  inited:false, introShown:false, wired:false
};
var HEIGHT_SCALE = 1.35, SPACING_SCALE = 1.45;
var DEFAULT_CAM = { radius:225, theta:Math.PI/2, phi:Math.PI/3.5 };

function dashUpdateCamera(){
  var c = DASH;
  c.camera.position.x = c.cameraTarget.x + c.cameraRadius * Math.sin(c.cameraPhi) * Math.cos(c.cameraTheta);
  c.camera.position.y = c.cameraTarget.y + c.cameraRadius * Math.cos(c.cameraPhi);
  c.camera.position.z = c.cameraTarget.z + c.cameraRadius * Math.sin(c.cameraPhi) * Math.sin(c.cameraTheta);
  c.camera.lookAt(c.cameraTarget);
}
function dashResetCamera(){
  DASH.isCinematic = false;
  DASH.cameraTarget = new THREE.Vector3(0,0,0);
  DASH.cameraRadius = DEFAULT_CAM.radius; DASH.cameraTheta = DEFAULT_CAM.theta; DASH.cameraPhi = DEFAULT_CAM.phi;
  dashUpdateCamera();
}
function dashCreateTower(data){
  var group = new THREE.Group();
  group.position.set(data.x*SPACING_SCALE, 0, data.z*SPACING_SCALE);
  group.rotation.y = Math.PI/4;
  var height = data.height * HEIGHT_SCALE, coreWidth = data.width;
  var coreMat = new THREE.MeshStandardMaterial({ color:0x4b5563, roughness:0.7, metalness:0.2 });
  var core = new THREE.Mesh(new THREE.BoxGeometry(coreWidth, height, coreWidth), coreMat);
  core.position.y = height/2; core.castShadow = true; core.receiveShadow = true; core.userData = { towerId:data.id };
  group.add(core); DASH.interactiveObjects.push(core);
  var wingWidth = 10, wingDepth = 8, wingOffset = coreWidth/2 + wingWidth/2 - 1;
  var wingGeo = new THREE.BoxGeometry(wingWidth, height, wingDepth);
  [{x:wingOffset,z:0},{x:-wingOffset,z:0},{x:0,z:wingOffset},{x:0,z:-wingOffset}].forEach(function(off){
    var wing = new THREE.Mesh(wingGeo, coreMat);
    wing.position.set(off.x, height/2, off.z); wing.castShadow = true; wing.receiveShadow = true; wing.userData = { towerId:data.id };
    group.add(wing); DASH.interactiveObjects.push(wing);
  });
  var scaffoldGeo = new THREE.BoxGeometry(coreWidth+14, height+2, coreWidth+14);
  var scaffoldMat = new THREE.MeshBasicMaterial({ color:0x10b981, wireframe:true, transparent:true, opacity:0.35 });
  var scaffold = new THREE.Mesh(scaffoldGeo, scaffoldMat); scaffold.position.y = height/2;
  group.add(scaffold); DASH.scaffoldMeshes[data.id] = scaffold;
  var burnGeo = new THREE.BoxGeometry(coreWidth+14.5, height+2.5, coreWidth+14.5);
  var burnMat = new THREE.MeshBasicMaterial({ color:0xef4444, transparent:true, opacity:0, blending:THREE.AdditiveBlending });
  var burnOverlay = new THREE.Mesh(burnGeo, burnMat); burnOverlay.position.y = height/2; group.add(burnOverlay);
  var pCount = 80, pGeo = new THREE.BufferGeometry(), pPos = new Float32Array(pCount*3);
  for (var i=0;i<pCount*3;i+=3){ pPos[i]=(Math.random()-0.5)*20; pPos[i+1]=Math.random()*height; pPos[i+2]=(Math.random()-0.5)*20; }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
  var pMat = new THREE.PointsMaterial({ color:0xff4500, size:1.8, transparent:true, opacity:0, blending:THREE.AdditiveBlending });
  var particles = new THREE.Points(pGeo, pMat); group.add(particles);
  DASH.scene.add(group);
  DASH.towerMeshes[data.id] = { group:group, coreMat:coreMat, burnMat:burnMat, particles:particles, pMaterial:pMat, data:data };
}
function dashInit3D(){
  if (DASH.inited) return;

function dashOnResize(){
  var container = document.getElementById('dash-canvas-container');
  if (!container || !DASH.camera) return;
  DASH.camera.aspect = container.clientWidth/container.clientHeight; DASH.camera.updateProjectionMatrix();

}
function dashAnimate(){
  requestAnimationFrame(dashAnimate);
  if (!document.body.classList.contains('mode-3d') || !DASH.renderer) return;
  if (DASH.showFireEffects){
    Object.values(DASH.towerMeshes).forEach(function(item){
      if (item.particles && item.pMaterial.opacity > 0){
        var pos = item.particles.geometry.attributes.position.array;
        for (var i=1;i<pos.length;i+=3){ pos[i] += 0.25 + Math.random()*0.15; if (pos[i] > item.data.height*HEIGHT_SCALE) pos[i] = 0; }
        item.particles.geometry.attributes.position.needsUpdate = true;
      }
    });
  }
  DASH.renderer.render(DASH.scene, DASH.camera);
}
function dashCinematicCamera(progress){
  var f = SITE_DATA.towers.filter(function(tw){return tw.id==='F';})[0]; if (!f) return;
  var focusTarget = new THREE.Vector3(f.x*SPACING_SCALE, f.height*HEIGHT_SCALE/2, f.z*SPACING_SCALE);
  var zoomP = Math.min(progress/55, 1), rotP = Math.max(0, (progress-55)/45);
  DASH.cameraTarget = focusTarget.clone().lerp(new THREE.Vector3(0,0,0), zoomP);
  DASH.cameraRadius = 48 + (DEFAULT_CAM.radius-48)*zoomP;
  DASH.cameraTheta = DEFAULT_CAM.theta + Math.PI*rotP;
  DASH.cameraPhi = DEFAULT_CAM.phi;
  dashUpdateCamera();
}
function dashUpdateTimeline(progress){
  if (DASH.isCinematic) dashCinematicCamera(progress);
  var events = SITE_DATA.timelineEvents, idx = 0;
  for (var i=events.length-1;i>=0;i--){ if (progress >= events[i].progress){ idx = i; break; } }
  var current = events[idx], next = events[idx+1];
  var segT = next ? (progress - current.progress) / (next.progress - current.progress) : 0;
  var nextBurns = (next && next.towerBurns) || current.towerBurns || {};
  var elTs = document.getElementById('dash-current-timestamp'); if (elTs) elTs.textContent = current.timeStr + '（' + tr(current.stage) + '）';
  var elTt = document.getElementById('dash-detail-time'); if (elTt) elTt.textContent = current.timeStr;
  var elSt = document.getElementById('dash-detail-stage'); if (elSt) elSt.textContent = tr(current.stage);
  var elTi = document.getElementById('dash-detail-title'); if (elTi) elTi.textContent = tr(current.title);
  var elDe = document.getElementById('dash-detail-desc'); if (elDe) elDe.textContent = tr(current.desc);
  var elLo = document.getElementById('dash-m-location'); if (elLo) elLo.textContent = tr(current.location);
  var elSp = document.getElementById('dash-m-spread'); if (elSp) elSp.textContent = tr(current.spread);
  var elFi = document.getElementById('dash-m-finding'); if (elFi) elFi.textContent = tr(current.finding);
  var burns = current.towerBurns || {};
  SITE_DATA.towers.forEach(function(tw){
    var m = DASH.towerMeshes[tw.id]; if (!m) return;
    var v0 = burns[tw.id] || 0, v1 = nextBurns[tw.id] || 0;
    var v = v0 + (v1 - v0) * segT;
    if (DASH.showFireEffects && v > 0){
      m.burnMat.opacity = v*0.7; m.pMaterial.opacity = v>0.1 ? Math.min(1,v+0.2) : 0;
      m.coreMat.color.setHSL(0.05, 0.8, Math.max(0.1, 0.4 - v*0.3));
    } else { m.burnMat.opacity = 0; m.pMaterial.opacity = 0; m.coreMat.color.setHex(0x4b5563); }
    var badge = document.getElementById('dash-badge-'+tw.id);
    if (badge){
      if (v >= 0.8){ badge.textContent = t('badgeSevere'); badge.className = 'dash-badge b-severe'; }
      else if (v > 0.2){ badge.textContent = t('badgeSpread'); badge.className = 'dash-badge b-spread'; }
      else if (v > 0){ badge.textContent = t('badgeLight'); badge.className = 'dash-badge b-light'; }
      else { badge.textContent = t('badgeNone'); badge.className = 'dash-badge'; }
    }
  });
}
function dashSetupInteraction(container){
  var hoverLabel = document.getElementById('dash-tower-hover-label');
  var clickStart = {x:0,y:0};
  var pointers = new Map(), lastPinch = 0;
  function pinchDist(){ var p = Array.from(pointers.values()); return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); }
  container.addEventListener('pointerdown', function(e){
    dashDismissGuide(); DASH.isCinematic = false; DASH.isMouseDown = true;
    container.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if (pointers.size === 2) lastPinch = pinchDist();
    clickStart = {x:e.clientX,y:e.clientY}; DASH.prevMouse = {x:e.clientX,y:e.clientY};
  });
  container.addEventListener('pointermove', function(e){
    if (e.pointerType === 'mouse' && !pointers.size) dashHover(e);
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if (pointers.size === 2){
      var d = pinchDist();
      DASH.cameraRadius = Math.max(30, Math.min(260, DASH.cameraRadius - (d-lastPinch)*0.5));
      lastPinch = d; dashUpdateCamera(); return;
    }
    var dx = e.clientX - DASH.prevMouse.x, dy = e.clientY - DASH.prevMouse.y;
    DASH.cameraTheta -= dx*0.008; DASH.cameraPhi -= dy*0.008;
    DASH.cameraPhi = Math.max(0.1, Math.min(Math.PI/2-0.05, DASH.cameraPhi));
    DASH.prevMouse = {x:e.clientX,y:e.clientY}; dashUpdateCamera();
  });
  container.addEventListener('pointerleave', function(){ if (hoverLabel) hoverLabel.style.display = 'none'; });
  function endPointer(e){
    if (!pointers.has(e.pointerId)) return;
    var single = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size){ var rest = Array.from(pointers.values())[0]; DASH.prevMouse = {x:rest.x,y:rest.y}; return; }
    DASH.isMouseDown = false;
    if (e.type === 'pointercancel' || !single) return;
    if (Math.abs(e.clientX-clickStart.x) < 5 && Math.abs(e.clientY-clickStart.y) < 5){
      var rect = container.getBoundingClientRect();
      DASH.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1; DASH.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
      DASH.raycaster.setFromCamera(DASH.mouse, DASH.camera);
      var hits = DASH.raycaster.intersectObjects(DASH.interactiveObjects);
      if (hits.length) dashOpenModal(hits[0].object.userData.towerId);
    }
  }
  container.addEventListener('pointerup', endPointer);
  container.addEventListener('pointercancel', endPointer);
  container.addEventListener('wheel', function(e){
    e.preventDefault();
    DASH.isCinematic = false; DASH.cameraRadius += e.deltaY*0.08;
    // upper bound must exceed DEFAULT_CAM.radius (225) or the first scroll jumps
    DASH.cameraRadius = Math.max(30, Math.min(260, DASH.cameraRadius)); dashUpdateCamera();
  }, { passive:false });
}
function dashHover(e){
  if (DASH.isMouseDown || !DASH.raycaster) return;
  var container = document.getElementById('dash-canvas-container');
  var rect = container.getBoundingClientRect();
  DASH.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1; DASH.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  DASH.raycaster.setFromCamera(DASH.mouse, DASH.camera);
  var hits = DASH.raycaster.intersectObjects(DASH.interactiveObjects);
  var label = document.getElementById('dash-tower-hover-label');
  if (!hits.length){ if (label) label.style.display = 'none'; return; }
  var tw = SITE_DATA.towers.filter(function(x){return x.id===hits[0].object.userData.towerId;})[0];
  if (!tw || !label) return;
  label.textContent = tw.name; label.style.left = (e.clientX+14)+'px'; label.style.top = (e.clientY+14)+'px'; label.style.display = 'block';
}

}

/* ================= SITE OPENING ANIMATION ================= */
// Plays full-screen every time the site is opened, then reveals Chapter 1.
// The animation is rendered live from the Claude Design code (vector SVG, sharp
// at any resolution) inside an isolated iframe so its styles can't leak.
function siteIntro(){
  var wrap = document.getElementById('site-intro');
  var frame = document.getElementById('site-intro-frame');
  var bar = document.querySelector('#site-intro-bar i');
  var skip = document.getElementById('site-intro-skip');
  if (!wrap || !frame) return;
  skip.textContent = LANG === 'en' ? 'Skip intro ▶▶' : '跳過開場 ▶▶';
  document.body.classList.add('intro-active');
  var finished = false, safety;
  function finish(){
    if (finished) return; finished = true;
    clearTimeout(safety);
    wrap.classList.add('done');
    document.body.classList.remove('intro-active');
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('message', onMsg);
    // Stop the animation's render loop once the fade-out is over
    setTimeout(function(){ frame.removeAttribute('srcdoc'); frame.src = 'about:blank'; }, 1000);
  }
  function onKey(e){ if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } }
  function onMsg(e){
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'wfc-opening-progress') bar.style.width = (e.data.t / e.data.d * 100) + '%';
    if (e.data.type === 'wfc-opening-ended') setTimeout(finish, 600); // hold the closing frame briefly
  }
  document.addEventListener('keydown', onKey);
  window.addEventListener('message', onMsg);
  skip.addEventListener('click', finish);
  // Keyboard shortcuts pressed while the iframe has focus
  frame.addEventListener('load', function(){
    try{ frame.contentWindow.addEventListener('keydown', onKey); }catch(e){}
  });
  // Safety net in case the animation never reports its end (e.g. script blocked)
  safety = setTimeout(finish, 90000);
  frame.srcdoc = OPENING_HTML;
}

function applyLang(newLang){
  LANG = newLang; SITE_DATA.meta.lang = newLang;
  try{ localStorage.setItem('wfc-lang', newLang); }catch(e){}
  var was3D = document.body.classList.contains('mode-3d');

function wireApp(){
  var langBtn = document.getElementById('btn-lang');
  if (langBtn) langBtn.addEventListener('click', function(){ applyLang(LANG==='zh'?'en':'zh'); });
  document.querySelectorAll('#page-editorial .tower-card').forEach(function(card){
    card.addEventListener('click', function(){ document.getElementById('chapter-2').scrollIntoView({behavior:'smooth', block:'start'}); });
    card.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); card.click(); } });
  });
  var goto3d = document.getElementById('btn-goto-3d'); if (goto3d) goto3d.addEventListener('click', show3D);
  var goto3dCta = document.getElementById('btn-goto-3d-cta'); if (goto3dCta) goto3dCta.addEventListener('click', show3D);

  var editBtn = document.getElementById('btn-edit');
  var modal = document.getElementById('edit-modal');
  if (editBtn) editBtn.addEventListener('click', function(){ modal.classList.add('open'); openEditTab(currentEditTab); });
  [document.getElementById('edit-close'), document.getElementById('edit-cancel')].forEach(function(b){ if(b) b.addEventListener('click', function(){ modal.classList.remove('open'); }); });
  document.querySelectorAll('.edit-tab').forEach(function(elm){ elm.addEventListener('click', function(){ openEditTab(elm.getAttribute('data-tab')); }); });

  var saveBtn = document.getElementById('edit-save');
  if (saveBtn) saveBtn.addEventListener('click', async function(){
    if (currentEditTab === 'json'){
      try{
        var parsed = JSON.parse(document.getElementById('json-editor').value);
        Object.keys(parsed).forEach(function(k){ SITE_DATA[k] = parsed[k]; });
      }catch(e){ document.getElementById('save-status').textContent = 'JSON parse error: '+e.message; return; }
    }
    SITE_DATA.meta.lastUpdated = new Date().toISOString().slice(0,10);
    document.getElementById('save-status').textContent = '…';
    var ok = await publishCurrentState();
    document.getElementById('save-status').textContent = ok ? t('savedOk') : t('saveErr');
    if (ok){ setTimeout(function(){ modal.classList.remove('open'); var was3D = document.body.classList.contains('mode-3d'); DASH.inited = false; rerenderAll(); if (was3D) show3D(); }, 500); }
  });
}

async function publishCurrentState(){
  try{
    var artifact = await claude.use('artifact');
    if (!artifact) return false;
    var res = await artifact.publish(buildFullDocument());
    return !!(res && (res.ok !== false));
  }catch(e){ console.error(e); return false; }
}
async function detectWriteAccess(){
  try{
    var artifact = await claude.use('artifact');
    if (!artifact) return;
    ['btn-edit','dash-btn-edit'].forEach(function(id){ var b = document.getElementById(id); if (b) b.classList.remove('hidden'); });
  }catch(e){}
}

/* ---------- boot ---------- */
try{ var saved = localStorage.getItem('wfc-lang'); if (saved) { LANG = saved; SITE_DATA.meta.lang = saved; } }catch(e){}
document.body.className = '';
rerenderAll();
showEditorial();
siteIntro();
detectWriteAccess();

}
appMain(SITE_DATA);
</script>
