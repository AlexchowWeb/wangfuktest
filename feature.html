<!doctype html><html lang="zh-Hant"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>宏福苑大火全紀錄｜專題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --paper:#f6f3ec; --paper-raised:#ffffff; --ink:#1c1a15; --ink-dim:#5c5646; --ink-faint:#8d8672;
  --rule:#ddd6c4; --rule-strong:#c3baa2; --accent:#b5232a; --accent-dim:#e7b9ba; --accent-ink:#ffffff;
  --blue:#2b5a86; --green:#2f6b4f; --purple:#6a4f8c; --amber:#a3691b;
  --font-display:'Noto Serif TC','Noto Serif',serif;
  --font-body:'Noto Sans TC','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#17150f; --paper-raised:#211e15; --ink:#ece6d6; --ink-dim:#b7ae97; --ink-faint:#847c67; --rule:#332f22; --rule-strong:#464031; --accent:#e2585c; --accent-dim:#4a2426; --accent-ink:#1a0a0a; --blue:#7ba7d6; --green:#7fbf9c; --purple:#b49bdc; --amber:#e0a94f; }
}
:root[data-theme="dark"]{ --paper:#17150f; --paper-raised:#211e15; --ink:#ece6d6; --ink-dim:#b7ae97; --ink-faint:#847c67; --rule:#332f22; --rule-strong:#464031; --accent:#e2585c; --accent-dim:#4a2426; --accent-ink:#1a0a0a; --blue:#7ba7d6; --green:#7fbf9c; --purple:#b49bdc; --amber:#e0a94f; }
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;font-family:var(--font-body);background:var(--paper);color:var(--ink);}
body.mode-3d{overflow:hidden;height:100vh;background:#0b0f19;color:#f3f4f6;}
h1,h2,h3,.font-display{font-family:var(--font-display);text-wrap:balance;}
.tabular,.font-mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.wrap{max-width:760px;margin:0 auto;padding:0 1.5rem;}
.wrap-wide{max-width:1040px;margin:0 auto;padding:0 1.5rem;}
a{color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--rule-strong);border-radius:4px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}
.icon-inline{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex-shrink:0;}
.hidden{display:none!important;}

/* ---- editorial nav ---- */
#site-nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);}
#site-nav .bar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.wordmark{display:flex;align-items:baseline;gap:.5rem;text-decoration:none;color:var(--ink);}
.wordmark .zh{font-family:var(--font-display);font-weight:900;font-size:1.05rem;letter-spacing:.02em;color:var(--accent);}
.wordmark .en{font-size:.6rem;letter-spacing:.16em;color:var(--ink-faint);font-weight:600;}
.nav-links{display:none;gap:1.5rem;font-size:.8rem;color:var(--ink-dim);}
@media(min-width:768px){.nav-links{display:flex;}}
.nav-links a{color:var(--ink-dim);text-decoration:none;}
.nav-links a:hover{color:var(--accent);}
.nav-btn{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.4rem .7rem;border-radius:8px;border:1px solid var(--rule-strong);background:var(--paper-raised);color:var(--ink-dim);cursor:pointer;white-space:nowrap;}
.nav-btn:hover{color:var(--ink);border-color:var(--accent);}
.nav-btn.accent{border-color:var(--accent);color:var(--accent);}

/* ---- kicker / chapter headers ---- */
.kicker{display:flex;align-items:center;gap:.6rem;color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.9rem;}
.kicker::before{content:'';width:22px;height:2px;background:var(--accent);display:block;}
.chapter{padding:3.2rem 0;border-top:1px solid var(--rule);}
.chapter:first-of-type{border-top:none;}
.h1-title{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:900;line-height:1.18;letter-spacing:-.01em;}
.h2-title{font-size:clamp(1.5rem,3.4vw,2.15rem);font-weight:800;line-height:1.22;}
.lede{font-size:1.02rem;line-height:1.85;color:var(--ink-dim);margin-top:1.1rem;}
.byline-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;font-size:.74rem;color:var(--ink-faint);margin-top:1.3rem;padding-top:1rem;border-top:1px solid var(--rule);}

.stat-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:1.8rem;}
@media(min-width:640px){.stat-strip{grid-template-columns:repeat(4,1fr);}}
.stat-cell{background:var(--paper-raised);padding:1rem .9rem;}
.stat-num{font-family:var(--font-mono);font-weight:700;font-size:1.7rem;color:var(--accent);line-height:1;}
.stat-num small{font-size:.95rem;font-weight:600;color:var(--ink-faint);}
.stat-label{font-size:.68rem;color:var(--ink-faint);margin-top:.35rem;line-height:1.4;}

.chart-card{margin-top:1.8rem;border:1px solid var(--rule);border-radius:12px;background:var(--paper-raised);padding:1.2rem 1.3rem 1rem;}
.chart-caption{font-size:.72rem;color:var(--ink-faint);margin-top:.6rem;border-top:1px dashed var(--rule);padding-top:.6rem;}

.story-block{position:relative;padding:1.6rem 0 1.6rem 1.6rem;border-left:2px solid var(--rule-strong);}
.story-block:last-child{border-color:transparent;}
.story-block::before{content:'';position:absolute;left:-6px;top:1.9rem;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);}
.story-block[data-phase="aftermath"]::before{border-color:var(--blue);}
.story-time{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--ink-faint);letter-spacing:.02em;}
.story-title{font-size:1.12rem;font-weight:700;margin-top:.4rem;line-height:1.4;}
.story-desc{font-size:.9rem;line-height:1.75;color:var(--ink-dim);margin-top:.45rem;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
.badge-verified{color:var(--green);border-color:var(--green);background:color-mix(in srgb, var(--green) 10%, transparent);}
.badge-unverified{color:var(--amber);border-color:var(--amber);background:color-mix(in srgb, var(--amber) 10%, transparent);}
.tag-pill{display:inline-block;font-size:.63rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;}
.tag-charges{background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--accent);}
.tag-inquiry{background:color-mix(in srgb, var(--blue) 14%, transparent);color:var(--blue);}
.tag-policy{background:color-mix(in srgb, var(--green) 14%, transparent);color:var(--green);}
.tag-press{background:color-mix(in srgb, var(--purple) 14%, transparent);color:var(--purple);}
.tag-human{background:color-mix(in srgb, var(--amber) 14%, transparent);color:var(--amber);}
.source-link{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;margin-top:.55rem;color:var(--ink-faint);text-decoration:none;border-bottom:1px dotted var(--ink-faint);}
.source-link:hover{color:var(--accent);border-color:var(--accent);}

.tower-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-top:1.8rem;}
@media(min-width:640px){.tower-grid{grid-template-columns:repeat(4,1fr);}}
.tower-card{border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);padding:.8rem .85rem;cursor:pointer;transition:border-color .15s,transform .15s;}
.tower-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.tower-card .tid{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-faint);font-weight:700;}
.tower-card .tname{font-size:.82rem;font-weight:700;margin-top:.15rem;line-height:1.3;}
.tower-card .tdeaths{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;margin-top:.4rem;}
.tower-card .tdeaths small{font-size:.65rem;font-weight:600;color:var(--ink-faint);}
.tower-card .tbar{height:4px;border-radius:2px;background:var(--rule);margin-top:.5rem;overflow:hidden;}
.tower-card .tbar i{display:block;height:100%;background:var(--accent);}

.cta-card{margin-top:1.8rem;border:1px solid var(--rule-strong);border-radius:14px;background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 8%, var(--paper-raised)), var(--paper-raised));padding:1.5rem 1.6rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.cta-card h4{margin:0 0 .3rem;font-size:1.05rem;font-weight:800;}
.cta-card p{margin:0;font-size:.82rem;color:var(--ink-dim);}
.cta-btn{flex-shrink:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem;padding:.65rem 1.2rem;border-radius:10px;border:none;cursor:pointer;white-space:nowrap;}
.cta-btn:hover{opacity:.9;}

.fail-list{margin-top:1.2rem;display:flex;flex-direction:column;gap:.9rem;}
.fail-item{display:flex;gap:.8rem;padding:.9rem 1rem;border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);}
.fail-num{font-family:var(--font-mono);font-weight:800;color:var(--accent);font-size:.85rem;flex-shrink:0;}
.fail-title{font-weight:700;font-size:.9rem;}
.fail-desc{font-size:.82rem;color:var(--ink-dim);line-height:1.7;margin-top:.25rem;}
.fail-tower{font-family:var(--font-mono);font-size:.65rem;color:var(--ink-faint);margin-top:.35rem;}

.victim-groups{margin-top:1.8rem;display:grid;grid-template-columns:1fr;gap:.9rem;}
@media(min-width:640px){.victim-groups{grid-template-columns:repeat(2,1fr);}}
.victim-group{border:1px solid var(--rule);border-radius:10px;background:var(--paper-raised);}
.victim-group summary{list-style:none;cursor:pointer;padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.86rem;}
.victim-group summary::-webkit-details-marker{display:none;}
.victim-group summary .n{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:.8rem;}
.victim-names{padding:0 1rem 1rem;display:flex;flex-wrap:wrap;gap:.4rem;}
.victim-chip{font-size:.78rem;padding:.25rem .6rem;border-radius:999px;background:color-mix(in srgb, var(--accent) 8%, var(--paper));border:1px solid var(--rule);}
.victim-empty{padding:0 1rem 1rem;font-size:.76rem;color:var(--ink-faint);line-height:1.6;}
.victim-note{margin-top:1.4rem;border:1px dashed var(--rule-strong);border-radius:10px;padding:1rem 1.1rem;font-size:.8rem;line-height:1.75;color:var(--ink-dim);background:color-mix(in srgb, var(--amber) 6%, transparent);}

.recap-block{border:1px solid var(--rule);border-radius:12px;background:var(--paper-raised);padding:1.4rem 1.5rem;margin-top:1.4rem;}
.recap-block h3{font-size:1.05rem;font-weight:800;margin:0 0 .5rem;}

footer.site-footer{border-top:1px solid var(--rule);padding:2.4rem 0 3rem;font-size:.78rem;color:var(--ink-faint);}
footer.site-footer h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 .7rem;}
.src-list{display:grid;grid-template-columns:1fr;gap:.4rem .9rem;}
@media(min-width:768px){.src-list{grid-template-columns:1fr 1fr;}}
.src-list a{color:var(--ink-dim);text-decoration:none;font-size:.78rem;line-height:1.5;}
.src-list a:hover{color:var(--accent);text-decoration:underline;}

/* ---- edit modal (shared) ---- */
#edit-modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding:2.5rem 1rem;background:rgba(20,18,12,.6);backdrop-filter:blur(3px);overflow-y:auto;}
#edit-modal.open{display:flex;}
.edit-panel{width:100%;max-width:820px;background:var(--paper-raised);border-radius:16px;border:1px solid var(--rule-strong);box-shadow:0 30px 70px rgba(0,0,0,.35);color:var(--ink);}
.edit-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.3rem;border-bottom:1px solid var(--rule);}
.edit-tabs{display:flex;gap:.3rem;padding:.7rem 1.3rem 0;flex-wrap:wrap;}
.edit-tab{font-size:.75rem;font-weight:600;padding:.4rem .75rem;border-radius:8px 8px 0 0;border:1px solid transparent;color:var(--ink-faint);cursor:pointer;}
.edit-tab.active{color:var(--accent);border-color:var(--rule) var(--rule) transparent;background:var(--paper);}
.edit-body{padding:1.1rem 1.3rem 1.3rem;max-height:60vh;overflow-y:auto;}
.ef{margin-bottom:.7rem;}
.ef label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:.3rem;font-weight:600;}
.ef input[type="text"],.ef input[type="number"],.ef input[type="url"],.ef input[type="date"],.ef textarea,.ef select{width:100%;background:var(--paper);border:1px solid var(--rule-strong);border-radius:8px;padding:.5rem .6rem;color:var(--ink);font-size:.8rem;font-family:var(--font-body);}
.ef textarea{resize:vertical;min-height:56px;}
.entry-card{border:1px solid var(--rule);border-radius:10px;padding:.8rem;margin-bottom:.7rem;background:var(--paper);}
.entry-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.mini-btn{font-size:.7rem;font-weight:600;padding:.3rem .6rem;border-radius:6px;border:1px solid var(--rule-strong);background:var(--paper-raised);cursor:pointer;color:var(--ink-dim);}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);}
.edit-foot{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:1rem 1.3rem;border-top:1px solid var(--rule);}
.save-status{font-size:.72rem;color:var(--ink-faint);}
.btn-primary{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.82rem;padding:.55rem 1.1rem;border-radius:8px;border:none;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--rule-strong);color:var(--ink-dim);font-size:.8rem;padding:.5rem .9rem;border-radius:8px;cursor:pointer;}

/* ============ DASHBOARD (3D reconstruction) PAGE — dark theme, fixed viewport ============ */
#page-3d{position:fixed;inset:0;z-index:1;background:#0b0f19;color:#f3f4f6;font-family:var(--font-body);}
body:not(.mode-3d) #page-3d{display:none;}
body.mode-3d #page-editorial{display:none;}
/* ---- site opening animation ---- */
body.intro-active{overflow:hidden;}
#site-intro{position:fixed;inset:0;z-index:200;background:#f3f2f2;display:flex;align-items:center;justify-content:center;transition:opacity .9s ease,visibility .9s ease;}
#site-intro.done{opacity:0;visibility:hidden;pointer-events:none;}
#site-intro-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f3f2f2;}
#site-intro-skip{position:absolute;right:clamp(1rem,3vw,2rem);bottom:clamp(1.4rem,4vh,2.4rem);font:600 .78rem var(--font-body);color:#201e1d;background:rgba(255,255,255,.85);border:1px solid #c3baa2;border-radius:999px;padding:.5rem 1rem;cursor:pointer;display:flex;align-items:center;gap:.4rem;}
#site-intro-skip:hover{background:#fff;}
#site-intro-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(32,30,29,.12);}
#site-intro-bar i{display:block;height:100%;width:0;background:#b5232a;}
#dash-canvas-container{touch-action:none;}
/* phones: keep the 3D model visible — tower list is reachable by tapping towers */
@media (max-width:767px){
  .dash-aside-left{display:none!important;}
  .dash-stats-box{display:none!important;}
  .dash-title-box p{display:none;}
  #dash-detail-panel{top:auto!important;bottom:11.5rem;left:1rem;right:1rem;width:auto!important;padding:.8rem!important;}
  #dash-detail-desc{display:none;}
}
#dash-canvas-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:0;}
.dash-glass{background:rgba(17,24,39,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);}
#dash-tower-hover-label{position:fixed;display:none;z-index:30;pointer-events:none;padding:6px 10px;border:1px solid rgba(245,158,11,.7);border-radius:8px;background:rgba(17,24,39,.94);color:#fef3c7;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#dash-interaction-guide{position:fixed;top:5rem;left:50%;transform:translateX(-50%);z-index:30;width:16rem;border-radius:1rem;border:1px solid rgba(75,85,99,.8);background:rgba(3,7,18,.95);padding:.9rem;font-size:.72rem;color:#d1d5db;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);}
#dash-interaction-guide h2{margin:0 0 .5rem;font-size:.8rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.4rem;}
#dash-interaction-guide ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45rem;}
#dash-intro-overlay{position:fixed;inset:0;z-index:60;background:#05070d;overflow:hidden;transition:opacity 1s ease,visibility 1s ease;}
#dash-intro-overlay.intro-complete{opacity:0;visibility:hidden;pointer-events:none;}
#dash-intro-video{width:100%;height:100%;object-fit:contain;background:#05070d;}
#dash-intro-overlay::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,13,.85),transparent 22%,transparent 78%,rgba(5,7,13,.7));pointer-events:none;}
#dash-intro-content{position:absolute;left:clamp(1.2rem,5vw,4rem);bottom:clamp(1.2rem,5vh,3rem);z-index:1;max-width:30rem;}
#dash-intro-content h1{font-size:clamp(1.4rem,3.4vw,2.2rem);font-weight:800;color:#fff;line-height:1.25;margin:.5rem 0 0;}
#dash-intro-content p{font-size:.8rem;color:#d1d5db;margin-top:.6rem;line-height:1.6;}
.dash-header{position:absolute;top:1rem;left:1rem;right:1rem;z-index:10;display:flex;flex-direction:column;gap:.75rem;pointer-events:none;}
@media(min-width:768px){.dash-header{flex-direction:row;justify-content:space-between;align-items:center;}}
.dash-title-box{padding:.8rem 1.2rem;border-radius:1rem;pointer-events:auto;border-left:4px solid #ef4444;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);max-width:32rem;}
.dash-title-box h1{margin:0;font-size:1.05rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem;letter-spacing:.02em;}
.dash-title-box p{margin:.2rem 0 0;font-size:.68rem;color:#9ca3af;}
.dash-stats-box{padding:.65rem 1rem;border-radius:1rem;pointer-events:auto;display:flex;align-items:center;gap:1.2rem;font-size:.72rem;color:#d1d5db;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);flex-wrap:wrap;}
.dash-nav-btns{display:flex;gap:.4rem;pointer-events:auto;}
.dash-btn{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;padding:.4rem .65rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.14);background:rgba(17,24,39,.85);color:#e5e7eb;cursor:pointer;white-space:nowrap;}
.dash-btn:hover{color:#fff;border-color:#f59e0b;}
.dash-aside-left{position:absolute;top:6.2rem;left:1rem;z-index:10;width:17.5rem;max-height:calc(100vh - 11rem);overflow-y:auto;display:flex;flex-direction:column;gap:.7rem;}
.dash-panel{padding:1rem;border-radius:1rem;box-shadow:0 20px 25px -5px rgba(0,0,0,.4);}
.dash-panel h2,.dash-panel h3{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin:0 0 .7rem;display:flex;justify-content:space-between;align-items:center;}
.dash-tower-row{padding:.6rem;border-radius:.75rem;background:rgba(3,7,18,.55);border:1px solid rgba(31,41,55,.9);display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s;margin-bottom:.4rem;}
.dash-tower-row:hover{background:rgba(31,41,55,.85);}
.dash-tower-row .name{font-size:.72rem;font-weight:700;color:#e5e7eb;}
.dash-tower-row .sub{font-size:.62rem;color:#9ca3af;margin-top:.1rem;}
.dash-badge{font-size:.6rem;padding:2px 8px;border-radius:6px;font-weight:600;background:#1f2937;color:#9ca3af;white-space:nowrap;}
.dash-badge.b-severe{background:#450a0a;color:#f87171;border:1px solid #7f1d1d;}
.dash-badge.b-spread{background:#451a03;color:#fbbf24;border:1px solid #78350f;}

/* ---- revision: chapters ---- */
button.stat-cell{font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;transition:background .15s;}
button.stat-cell:hover{background:color-mix(in srgb, var(--accent) 6%, var(--paper-raised));}
button.stat-cell[aria-expanded="true"]{background:color-mix(in srgb, var(--accent) 10%, var(--paper-raised));box-shadow:inset 0 -3px 0 var(--accent);}
.stat-detail{margin-top:.8rem;border:1px solid var(--rule);border-radius:12px;background:var(--paper-raised);padding:1rem 1.1rem;}
.stat-detail-empty{margin:0;font-size:.82rem;color:var(--ink-faint);}
.stat-detail-item{padding:.6rem 0;border-bottom:1px dashed var(--rule);font-size:.88rem;}
.stat-detail-item:last-child{border-bottom:0;}
.stat-detail-item .meta{font-size:.7rem;color:var(--ink-faint);font-family:var(--font-mono);}

.story-grid{margin-top:2.2rem;}
.story-row{display:grid;grid-template-columns:1fr;}
.story-media{margin:0 0 1.4rem 1.6rem;}
.story-media img{width:100%;border-radius:10px;display:block;}
.story-media figcaption{font-size:.7rem;color:var(--ink-faint);margin-top:.35rem;}
.media-slot{aspect-ratio:4/3;border:1px dashed var(--rule-strong);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--ink-faint);background:repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, var(--rule) 45%, transparent) 10px 20px);}

  .story-row{grid-template-columns:minmax(0,1fr) minmax(0,600px) minmax(0,1fr);column-gap:2rem;}
  .story-row > .story-block{grid-column:2;}
  .story-row.media-right > .story-media{grid-column:3;grid-row:1;margin:1.6rem 0 0;align-self:start;}
  .story-row.media-left > .story-media{grid-column:1;grid-row:1;margin:1.6rem 0 0;align-self:start;}
}
.name-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:2rem;}
.wall-name{font-family:var(--font-display);font-size:1rem;font-weight:600;line-height:1.3;color:var(--ink);background:var(--paper-raised);border:0;padding:.3rem .3rem;text-align:center;cursor:pointer;min-height:0;transition:background .2s,color .2s;}

.wall-name:hover,.wall-name:focus-visible{background:var(--paper);color:var(--accent);}
.wall-name.has-story{color:var(--accent);}
.wall-name.pending{cursor:default;background:color-mix(in srgb, var(--paper-raised) 70%, var(--paper));}
.wall-name.pending::after{content:'';display:block;width:1.6rem;height:1px;margin:0 auto;background:var(--rule-strong);}
#victim-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem;background:color-mix(in srgb, var(--paper) 30%, rgba(0,0,0,.6));backdrop-filter:blur(6px);}
#victim-modal[hidden]{display:none;}

.victim-close{position:absolute;top:.8rem;right:.8rem;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.victim-name{font-size:2rem;font-weight:900;margin:0;}
.victim-tower{margin:.4rem 0 0;font-size:.82rem;color:var(--ink-faint);letter-spacing:.08em;}

.dash-stage-btn{display:flex;flex-direction:column;align-items:flex-start;gap:.12rem;padding:.4rem .65rem;line-height:1.2;}

/* ---- 專題 pages: light newsprint palette, always — set apart from the dark 3D reconstruction ---- */
:root:root:root{ color-scheme:light; --paper:#f4efe6; --paper-raised:#fbf8f2; --ink:#1d1915; --ink-dim:#4f463d; --ink-faint:#857a6d; --rule:#e2d9ca; --rule-strong:#c9bca8; --accent:#a3302a; --accent-dim:#efc9c4; --accent-ink:#ffffff; --blue:#2f5f7a; --green:#3f6b3f; --purple:#6b4f7a; --amber:#96651e; }
.victim-role{margin:.35rem 0 0;font-size:.8rem;font-weight:700;color:var(--accent);letter-spacing:.06em;}
/* ---- chapter 2: Jenga tower ---- */
.jenga-layout{display:grid;grid-template-columns:1fr;gap:0 3rem;margin-top:1rem;}
.jenga-stage{position:sticky;top:54px;z-index:2;height:42vh;background:var(--paper);overflow:hidden;}

/* ---- scroll-driven tour ---- */
#story-overlay{position:fixed;inset:0;z-index:15;pointer-events:none;}
#story-overlay[hidden]{display:none;}
#story-overlay::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(18,12,8,.62) 0%, rgba(18,12,8,.25) 38%, transparent 62%);opacity:0;transition:opacity .8s;}
body.story-mode #story-overlay::before{opacity:1;}
.story-ev{position:absolute;left:clamp(1.2rem,6vw,6rem);top:50%;max-width:min(34rem,86vw);transform:translateY(-50%);opacity:0;color:#fff6ea;text-shadow:0 2px 18px rgba(0,0,0,.45);will-change:opacity,transform;}
.se-count{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.2em;color:#f3c06b;}
.se-time{font-size:clamp(3.4rem,10vw,7.5rem);font-weight:900;line-height:1;margin:.3rem 0 .25rem;letter-spacing:-.01em;}
.se-time-to{font-size:.32em;font-weight:700;margin-left:.35em;letter-spacing:0;color:#ecdcc4;vertical-align:.15em;}
.se-date{font-size:.85rem;letter-spacing:.08em;color:#ecdcc4;}
.se-title{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:800;margin:.9rem 0 .5rem;line-height:1.35;color:#fff6ea;}
.se-desc{font-size:.95rem;line-height:1.8;color:#eadcc8;margin:0;}
.story-hint{position:absolute;left:50%;bottom:2.2rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.78rem;letter-spacing:.12em;color:#fff6ea;text-shadow:0 1px 8px rgba(0,0,0,.5);transition:opacity .6s;}
.story-hint span{animation:story-bob 1.6s ease-in-out infinite;}
.story-hint.gone{opacity:0;}
@keyframes story-bob{50%{transform:translateY(6px);}}
.story-skip{position:absolute;right:1.5rem;bottom:1.8rem;pointer-events:auto;background:none;border:0;color:#fff6ea;font:600 .78rem var(--font-body);letter-spacing:.08em;cursor:pointer;opacity:.75;text-shadow:0 1px 8px rgba(0,0,0,.5);}
.story-skip:hover,.story-skip:focus-visible{opacity:1;}
body:not(.story-mode) .story-skip,body:not(.story-mode) .story-hint,body:not(.story-mode) .story-ev{opacity:0 !important;pointer-events:none;transition:opacity .6s;}
/* panels are hidden at once for the tour and dissolve back in, one after another, when it ends */
body.story-reveal .dash-header,body.story-reveal .dash-aside-left,body.story-reveal #dash-detail-panel,body.story-reveal .dash-footer{transition:opacity 1.1s ease;}
body.story-reveal .dash-aside-left{transition-delay:.2s;} body.story-reveal #dash-detail-panel{transition-delay:.4s;} body.story-reveal .dash-footer{transition-delay:.6s;}
body.story-mode .dash-header,body.story-mode .dash-aside-left,body.story-mode #dash-detail-panel,body.story-mode .dash-footer,body.story-mode #dash-tower-hover-label{opacity:0 !important;pointer-events:none !important;transition:none;}
body.story-mode #dash-canvas-container{cursor:default;}
@media (max-width:767px){ .story-ev{top:44%;} .se-desc{font-size:.85rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;} }
#dash-sky-clock{display:flex;align-items:center;gap:.35rem;margin-top:.15rem;font-size:.7rem;color:#f3c06b;font-family:var(--font-mono);}

#dash-btn-back{border-color:#e0a050;color:#fff6ea;}

function svgBarChart(labels, values, opts){
  opts = opts || {};
  var w = 640, h = 180, padL = 28, padB = 34, padT = 10, padR = 10;
  var max = Math.max.apply(null, values) || 1;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  var n = values.length, gap = innerW / n * 0.28;
  var barW = (innerW / n) - gap;
  var bars = '', labelsSvg = '', valuesSvg = '';
  for (var i=0;i<n;i++){
    var bh = Math.max(2, (values[i]/max) * innerH);
    var x = padL + i * (innerW/n) + gap/2;
    var y = padT + innerH - bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--accent)" opacity="'+(opts.opacityFn?opts.opacityFn(values[i],max):0.85)+'"></rect>';

    labelsSvg += '<text x="'+(x+barW/2).toFixed(1)+'" y="'+(h-10).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-faint)">'+esc(labels[i])+'</text>';
  }

var deskObserver = null;
function wireDesk(){

  var A = SITE_DATA.accountability, n = A.docs.length;
  var papers = desk.querySelectorAll('.paper'), steps = desk.querySelectorAll('.desk-step');
  var seen = {};
  function show(k){
    desk.classList.toggle('is-intro', k === 0);
    desk.classList.toggle('is-end', k > n);
    papers.forEach(function(p, i){
      p.classList.toggle('is-open', i === k - 1);
      p.classList.toggle('is-pile', i < k - 1 || k > n);
    });
    // people and firms named so far are on the board; the current document's are in focus
    var on = {}, focus = (k >= 1 && k <= n) ? A.docs[k - 1].focus : [];
    for (var j = 0; j < Math.min(k, n); j++) A.docs[j].reveal.forEach(function(id){ on[id] = true; });
    var fresh = (k >= 1 && k <= n) ? A.docs[k - 1].reveal : [];
    desk.querySelectorAll('.b-node').forEach(function(g){
      var id = g.getAttribute('data-id');
      g.classList.toggle('is-on', !!on[id]);
      g.classList.toggle('is-focus', focus.indexOf(id) >= 0);
      if (on[id] && fresh.indexOf(id) >= 0 && !seen[id + k]){ seen[id + k] = true; g.classList.remove('is-new'); void g.getBBox(); g.classList.add('is-new'); }
    });
    desk.querySelectorAll('.b-edge').forEach(function(e){
      var a = e.getAttribute('data-a'), b = e.getAttribute('data-b');
      e.classList.toggle('is-on', !!(on[a] && on[b]));
      e.classList.toggle('is-focus', focus.indexOf(a) >= 0 && focus.indexOf(b) >= 0);
    });
    desk.classList.toggle('has-focus', focus.length > 0);
  }
  show(0);
  if (!('IntersectionObserver' in window)){ show(n + 1); return; }
  deskObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting) show(+en.target.getAttribute('data-k')); });
  }, { rootMargin:'-50% 0px -50% 0px' });
  steps.forEach(function(s){ deskObserver.observe(s); });
}

var JENGA = null;
function wireJenga(){
  var host = document.getElementById('jenga3d');

  if (!host || !steps.length || typeof THREE === 'undefined') return;
  var n = SITE_DATA.failedFacilities.length;

  JENGA.mount(host);
  function show(k){
    steps.forEach(function(s){ s.classList.toggle('is-active', +s.getAttribute('data-step') === k); });
    JENGA.setPulls(Math.min(k + 1, n));   // step k pulls block k; the final step keeps it fallen
  }
  if (JENGA.stepObserver) JENGA.stepObserver.disconnect();
  if (!('IntersectionObserver' in window)){ show(n); return; }
  // the step crossing the middle of the screen decides how many blocks are out
  JENGA.stepObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting) show(+en.target.getAttribute('data-step')); });
  }, { rootMargin:'-50% 0px -50% 0px' });
  steps.forEach(function(s){ JENGA.stepObserver.observe(s); });

  var invQ = new THREE.Quaternion(), local = new THREE.Vector3();
  function floorAt(x, z, self){
    var top = (Math.abs(x) < 1.55 && Math.abs(z) < 1.55) ? COLLAPSE_LAYER * H : 0;
    for (var i = 0; i < pullBlocks.length; i++){
      var p = pullBlocks[i];
      if (p === self || !p.settled) continue;
      invQ.copy(p.mesh.quaternion).invert();
      local.set(x - p.mesh.position.x, 0, z - p.mesh.position.z).applyQuaternion(invQ);
      if (Math.abs(local.x) < L/2 && Math.abs(local.z) < W/2) top = Math.max(top, p.mesh.position.y + H/2);
    }
    return top;
  }
  function stepBody(b, dt){
    if (!b.free || b.settled) return;
    b.vel.y -= G * dt;
    b.mesh.position.addScaledVector(b.vel, dt);
    var w = b.ang.length();
    if (w > 1e-4){
      var dq = new THREE.Quaternion().setFromAxisAngle(tmp.copy(b.ang).divideScalar(w), w * dt);
      b.mesh.quaternion.premultiply(dq).normalize();
    }
    var pen = 0;
    for (var i = 0; i < corners.length; i++){
      tmp.copy(corners[i]).applyQuaternion(b.mesh.quaternion).add(b.mesh.position);
      pen = Math.max(pen, floorAt(tmp.x, tmp.z, b) - tmp.y);
    }
    if (pen > 0){
      b.mesh.position.y += pen;
      if (b.vel.y < 0) b.vel.y *= -0.18;
      b.vel.x *= 0.45; b.vel.z *= 0.45; b.ang.multiplyScalar(0.5);
      if (b.vel.lengthSq() < 0.02 && b.ang.lengthSq() < 0.02) b.settled = true;
    }
  }

  // ---- state machine ----
  var current = 0, target = 0, anim = null, collapse = null;
  function startPull(k){
    var b = pullBlocks[k];
    anim = { b:b, t:0, from:b.restPos.clone(), to:pulledOutPos(b) };
  }
  function finishPull(){
    var b = anim.b;
    b.mesh.position.copy(anim.to); b.mesh.material.color.copy(EMBER);
    b.free = true; b.vel.set(0, 0, 0);         // drops to the table beside the tower
    anim = null; current++;
    if (current === nPulls) startCollapse();
  }
  function startCollapse(){
    // the tower above the emptied layer tips over the far edge (away from the viewer), then breaks apart
    var dir = new THREE.Vector3(-0.35, 0, -1).normalize();
    var pivot = dir.clone().multiplyScalar(1.5).setY(COLLAPSE_LAYER * H), axis = new THREE.Vector3(dir.z, 0, -dir.x);
    // blocks already pulled out are lying on the table — they are not part of the falling tower
    var upper = blocks.filter(function(b){ return b.layer > COLLAPSE_LAYER && !b.pull; });
    upper.forEach(function(b){ b.tipPos = b.mesh.position.clone(); b.tipQuat = b.mesh.quaternion.clone(); });
    collapse = { t:0, pivot:pivot, axis:axis, upper:upper, alpha:5, released:false };
  }
  function tipPose(c, b){
    var th = 0.5 * c.alpha * c.t * c.t, drop = Math.min(H, 0.5 * G * 0.6 * c.t * c.t);
    var q = new THREE.Quaternion().setFromAxisAngle(c.axis, th);
    b.mesh.position.copy(b.tipPos).sub(c.pivot).applyQuaternion(q).add(c.pivot); b.mesh.position.y -= drop;
    b.mesh.quaternion.copy(q).multiply(b.tipQuat);
  }
  function stepCollapse(dt){
    var c = collapse; c.t += dt;
    if (!c.released){
      c.upper.forEach(function(b){ tipPose(c, b); });
      if (0.5 * c.alpha * c.t * c.t >= 0.32){
        // release: each block keeps the velocity it had as part of the tipping tower
        var omega = c.axis.clone().multiplyScalar(c.alpha * c.t);
        c.upper.forEach(function(b){
          var r = b.mesh.position.clone().sub(c.pivot);
          b.vel.copy(omega).cross(r).add(new THREE.Vector3(rnd(1.2), -G * 0.6 * c.t, rnd(1.2)));
          b.ang.copy(omega).add(new THREE.Vector3(rnd(2), rnd(2), rnd(2)));
          b.free = true; b.settled = false;
        });
        c.released = true;
      }
    }
  }
  function simulate(dt){
    if (anim){
      anim.t += dt / 0.9;
      var e = anim.t < 1 ? 1 - Math.pow(1 - anim.t, 3) : 1;
      anim.b.mesh.position.copy(anim.from).lerp(anim.to, e);
      anim.b.mesh.material.color.copy(WHITE).lerp(EMBER, e);
      if (anim.t >= 1) finishPull();
    } else if (current < target && !collapse) startPull(current);
    if (collapse) stepCollapse(dt);
    for (var i = 0; i < blocks.length; i++) stepBody(blocks[i], dt);
  }
  // jump straight to a state (scrolling backwards, big jumps, reduced motion)
  function snapTo(p){
    anim = null; collapse = null;
    blocks.forEach(rest);
    for (var k = 0; k < p; k++){
      var b = pullBlocks[k];
      b.mesh.position.copy(pulledOutPos(b)); b.mesh.material.color.copy(EMBER); b.free = true;
    }
    current = p;
    if (p === nPulls) startCollapse();
    for (var s = 0; s < 600; s++) simulate(1/120);   // settle everything instantly
  }
  function setPulls(p){
    if (p === target) return;
    if (p < current || p > current + 1 || reduceMotion || collapse){ target = p; snapTo(p); return; }
    target = p;   // one more block: animate it out
  }

  // ---- render loop (only while the stage is on screen) ----
  var host = null, visible = false, last = 0, visObserver = null;
  function resize(){
    if (!host) return;
    var w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    var dist = 35 / Math.min(1, camera.aspect * 1.25);      // keep the whole tower in frame on narrow stages
    camera.position.set(0.55, 0.42, 0.72).normalize().multiplyScalar(dist).add(new THREE.Vector3(0, 5.2, 0));
    camera.lookAt(0, 4.2, 0); camera.updateProjectionMatrix();
  }
  function frame(ts){
    if (!visible) return;
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
    for (var i = 0; i < 4; i++) simulate(dt / 4);
    renderer.render(scene, camera);
  }
  window.addEventListener('resize', resize);
  return {
    stepObserver:null,
    setPulls:setPulls,
    mount:function(el){
      host = el; el.appendChild(renderer.domElement); resize();
      if (visObserver) visObserver.disconnect();
      visObserver = new IntersectionObserver(function(en){
        var was = visible; visible = en[0].isIntersecting;
        if (visible && !was){ last = 0; resize(); requestAnimationFrame(frame); }
      });
      visObserver.observe(el);
      renderer.render(scene, camera);
    }
  };
}

function openVictim(i){
  var v = SITE_DATA.victims[i]; if (!v) return;
  var tw = SITE_DATA.towers.filter(function(x){ return x.id === v.tower; })[0];
  var towerName = tw ? (LANG === 'en' ? tw.name.replace(/^.*\(|\)$/g, '') : tw.name.split(' (')[0]) : '';
  var s = v.story, html = '<h3 id="victim-name" class="victim-name font-display">' + esc(v.name) + '</h3>'
    + (towerName ? '<p class="victim-tower">' + esc(towerName) + '</p>' : '')
    + (v.firefighter ? '<p class="victim-role">' + esc(t('firefighterRole')) + '</p>' : '');
  if (s){
    if (s.photo) html += s.photo.src
      ? '<figure class="victim-photo"><img src="'+esc(s.photo.src)+'" alt="'+esc(v.name)+'"><figcaption>'+esc(tr(s.photo.caption))+(s.photo.credit ? ' · '+esc(s.photo.credit) : '')+'</figcaption></figure>'
      : '<div class="victim-photo media-slot">'+esc(t('imageSlot'))+'</div>';
    if (s.title) html += '<p class="victim-story-title">' + esc(tr(s.title)) + '</p>';
    if (s.summary) html += '<p class="victim-story">' + esc(tr(s.summary)) + '</p>';
    (s.items || []).forEach(function(it){
      html += it.url
        ? '<a class="victim-link" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(tr(it.title))+(it.source ? ' — '+esc(it.source) : '')+' →</a>'
        : '<span class="victim-link">'+esc(tr(it.title))+'</span>';
    });
  } else {
    html += '<p class="victim-remember">' + esc(t('victimRemember')) + '</p>';
  }
  document.getElementById('victim-body').innerHTML = html;
  var m = document.getElementById('victim-modal'); m.hidden = false;
  document.getElementById('victim-close').focus();
}
function closeVictim(){ var m = document.getElementById('victim-modal'); if (m) m.hidden = true; }

function wireChapters(){
  var detail = document.getElementById('stat-detail');
  document.querySelectorAll('#page-editorial .stat-cell').forEach(function(btn){
    btn.addEventListener('click', function(){
      var open = btn.getAttribute('aria-expanded') === 'true';
      document.querySelectorAll('#page-editorial .stat-cell').forEach(function(b){ b.setAttribute('aria-expanded', 'false'); });
      if (open){ detail.hidden = true; return; }
      btn.setAttribute('aria-expanded', 'true');
      detail.innerHTML = renderStatDetail(btn.getAttribute('data-stat'));
      detail.hidden = false;
    });
  });
  document.querySelectorAll('#page-editorial .wall-name[data-victim]').forEach(function(btn){
    btn.addEventListener('click', function(){ openVictim(+btn.getAttribute('data-victim')); });
  });
  wireJenga();
  wireDesk();
  var modal = document.getElementById('victim-modal');
  if (modal){
    document.getElementById('victim-close').addEventListener('click', closeVictim);
    modal.addEventListener('click', function(e){ if (e.target === modal) closeVictim(); });
  }
}

/* ================= DASHBOARD 3D ENGINE (ported from user's original build) ================= */
var DASH = {
  scene:null, camera:null, renderer:null, raycaster:null, mouse:null,
  towerMeshes:{}, scaffoldMeshes:{}, interactiveObjects:[],
  isPlaying:false, playInterval:null, showScaffolding:true, showFireEffects:true, isCinematic:false,
  isMouseDown:false, prevMouse:{x:0,y:0}, cameraTarget:null, cameraRadius:225, cameraTheta:Math.PI/2, cameraPhi:Math.PI/3.5,
  inited:false, introShown:false, wired:false
};
var SPACING_SCALE = 1.45, TOWER_ROT = Math.PI/4;
var DEFAULT_CAM = { radius:225, theta:Math.PI/2, phi:Math.PI/3.5 };

/* ---- Flat-level estate model ----
   8 towers × 31 floors × 8 flats = 1,984 flats, drawn as one InstancedMesh so every
   flat can be hovered and opened. Flat letters A–H run clockwise from the north arm
   and are illustrative, not the official numbering. Content per flat/floor/tower
   comes from SITE_DATA.unitMedia. */
var FLOORS = 31, FLAT_LETTERS = 'ABCDEFGH';
var FH = 1.25, LOBBY = 2.4, CORE = 8, ARM_L = 9, ARM_W = 9, UNIT_GAP = 0.24, UNIT_H = FH - 0.22;
var TOWER_TOP = LOBBY + FLOORS*FH, TOWER_SPAN = CORE + 2*ARM_L;
var UNIT_COLOR = { base:0xd4bd9b, media:0x8fbf9f, hover:0xffd27a, select:0xfffaf0, floor:0xfff0d6, ember:0x6e200e };
DASH.units = []; DASH.hoverUnit = -1; DASH.selectedUnit = -1; DASH.camGoal = null; DASH.cutFloor = FLOORS;

// 2 flats at the end of each of the 4 arms of the cross
function flatSlots(){
  var c = CORE/2 + ARM_L/2, q = ARM_W/4, ul = ARM_L - UNIT_GAP, uw = ARM_W/2 - UNIT_GAP;
  return [
    { x:-q, z: c, sx:uw, sz:ul }, { x: q, z: c, sx:uw, sz:ul },
    { x: c, z: q, sx:ul, sz:uw }, { x: c, z:-q, sx:ul, sz:uw },
    { x: q, z:-c, sx:uw, sz:ul }, { x:-q, z:-c, sx:uw, sz:ul },
    { x:-c, z:-q, sx:ul, sz:uw }, { x:-c, z: q, sx:ul, sz:uw }
  ];
}
function floorY(f){ return LOBBY + (f-1)*FH + FH/2; }
function towerCenter(tw){ return new THREE.Vector3(tw.x*SPACING_SCALE, 0, tw.z*SPACING_SCALE); }
function towerWorld(tw, lx, y, lz){ return new THREE.Vector3(lx, y, lz).applyAxisAngle(new THREE.Vector3(0,1,0), TOWER_ROT).add(towerCenter(tw)); }
function towerZh(tw){ return tw.name.split(' (')[0]; }
function towerEn(tw){ var p = tw.name.split(' ('); return p[1] ? p[1].replace(')','') : tw.name; }
function unitName(u){
  return LANG === 'en'
    ? towerEn(u.tower) + ' (Block ' + u.tower.id + ') ' + u.floor + '/F, Flat ' + u.flat
    : towerZh(u.tower) + '（' + u.tower.id + '座）' + u.floor + '樓 ' + u.flat + '室';
}

// Rules: { tower:'F'|'*', floors:[from,to]?, flats:'E'|'AB'|'*'?, items:[...] }
function unitMediaFor(u){
  var out = [], own = false;
  (SITE_DATA.unitMedia || []).forEach(function(r){
    if (r.tower && r.tower !== '*' && r.tower !== u.tower.id) return;
    if (r.floors && (u.floor < r.floors[0] || u.floor > r.floors[1])) return;
    if (r.flats && r.flats !== '*' && r.flats.indexOf(u.flat) < 0) return;
    var level = (r.flats && r.flats !== '*') ? 'unit' : r.floors ? 'floor' : (r.tower && r.tower !== '*') ? 'tower' : 'estate';
    if (level === 'unit' || level === 'floor') own = true;
    (r.items || []).forEach(function(it){ out.push(Object.assign({ level:level }, it)); });
  });
  u.media = out; u.hasOwnMedia = own;
}

function dashMakeLabel(text, pos){
  var c = document.createElement('canvas'); c.width = 512; c.height = 128;
  var g = c.getContext('2d');
  g.fillStyle = 'rgba(250,243,230,.94)'; g.strokeStyle = 'rgba(150,100,55,.55)'; g.lineWidth = 4;
  g.beginPath(); if (g.roundRect) g.roundRect(8, 20, 496, 88, 24); else g.rect(8, 20, 496, 88); g.fill(); g.stroke();
  g.fillStyle = '#3a2a1e'; g.font = '700 54px "Noto Serif TC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 256, 66);
  var s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthWrite:false }));
  s.scale.set(16, 4, 1); s.position.copy(pos); return s;
}

function dashBuildEstate(){
  var scene = DASH.scene, box = new THREE.BoxGeometry(1,1,1), dummy = new THREE.Object3D(), slots = flatSlots();
  DASH.col = {};
  Object.keys(UNIT_COLOR).forEach(function(k){ DASH.col[k] = new THREE.Color(UNIT_COLOR[k]); });
  DASH.units = []; DASH.baseMatrices = []; DASH.coreMeta = []; DASH.roofs = [];
  SITE_DATA.towers.forEach(function(tw){
    for (var f = 1; f <= FLOORS; f++) slots.forEach(function(s, i){
      var u = { tower:tw, floor:f, flat:FLAT_LETTERS[i], slot:s };
      u.key = tw.id + '-' + f + '-' + u.flat;
      unitMediaFor(u); DASH.units.push(u);
    });
  });
  var mesh = new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.6, metalness:0.05 }), DASH.units.length);
  mesh.castShadow = mesh.receiveShadow = true;
  DASH.units.forEach(function(u, i){
    dummy.position.copy(towerWorld(u.tower, u.slot.x, floorY(u.floor), u.slot.z));
    dummy.rotation.set(0, TOWER_ROT, 0); dummy.scale.set(u.slot.sx, UNIT_H, u.slot.sz); dummy.updateMatrix();
    DASH.baseMatrices.push(dummy.matrix.clone()); mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, DASH.col.base);
  });
  scene.add(mesh); DASH.unitMesh = mesh;

  // stair/lift cores, one block per floor so the floor cut can hide them
  var cores = new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({ color:0x6f5a48, roughness:0.85 }), SITE_DATA.towers.length*FLOORS);
  cores.castShadow = cores.receiveShadow = true;
  var slabMat = new THREE.MeshStandardMaterial({ color:0x8c7560, roughness:0.9 });
  SITE_DATA.towers.forEach(function(tw, ti){
    for (var f = 1; f <= FLOORS; f++){
      dummy.position.copy(towerWorld(tw, 0, floorY(f), 0)); dummy.rotation.set(0, TOWER_ROT, 0);
      dummy.scale.set(CORE + 0.6, FH, CORE + 0.6); dummy.updateMatrix();
      DASH.coreMeta.push({ floor:f, m:dummy.matrix.clone() }); cores.setMatrixAt(ti*FLOORS + f - 1, dummy.matrix);
    }
    [[TOWER_SPAN, ARM_W], [ARM_W, TOWER_SPAN]].forEach(function(d){
      var pod = new THREE.Mesh(box, slabMat);
      pod.scale.set(d[0], LOBBY, d[1]); pod.position.copy(towerWorld(tw, 0, LOBBY/2, 0)); pod.rotation.y = TOWER_ROT;
      pod.castShadow = pod.receiveShadow = true; scene.add(pod);
      var roof = new THREE.Mesh(box, slabMat);
      roof.scale.set(d[0] + 0.4, 0.5, d[1] + 0.4); roof.position.copy(towerWorld(tw, 0, TOWER_TOP + 0.25, 0)); roof.rotation.y = TOWER_ROT;
      roof.castShadow = true; scene.add(roof); DASH.roofs.push(roof);
    });
    scene.add(dashMakeLabel(tw.id + ' ' + towerZh(tw), towerWorld(tw, 0, TOWER_TOP + 5, 0)));

    // bamboo scaffold + netting wraps the whole tower (burns away as the timeline advances)
    var group = new THREE.Group(); group.position.copy(towerCenter(tw)); group.rotation.y = TOWER_ROT;
    var scaffold = dashBuildScaffold();
    group.add(scaffold.group); DASH.scaffoldMeshes[tw.id] = scaffold.group;
    scene.add(group);
    // firelight: lights up the estate around a burning tower, strongest at night
    var fireLight = new THREE.PointLight(0xff7a3c, 0, 70, 1.6);
    fireLight.position.copy(towerWorld(tw, 0, TOWER_TOP*0.45, 0)); scene.add(fireLight);
    DASH.towerMeshes[tw.id] = { data:tw, burn:0, light:fireLight, lightBase:0, netMat:scaffold.netMat, poleMat:scaffold.poleMat };
  });
  scene.add(cores); DASH.coreMesh = cores;
  dashInitFx();
  dashRepaintUnits();
}

// Bamboo scaffolding (standards + ledgers) with green netting, following the cross-shaped
// facade 0.9 out from the walls — one net panel per face of the cross.
var SCAFFOLD_BAMBOO = 0xb8925a, SCAFFOLD_CHAR = 0x2b1d14, NET_OPACITY = 0.24;
function dashBuildScaffold(){
  var w = ARM_W/2 + 0.9, e = CORE/2 + ARM_L + 0.9, top = TOWER_TOP + 1, bottom = LOBBY * 0.5;
  var pts = [[-w,e],[w,e],[w,w],[e,w],[e,-w],[w,-w],[w,-e],[-w,-e],[-w,-w],[-e,-w],[-e,w],[-w,w]];
  var poleMat = new THREE.LineBasicMaterial({ color:SCAFFOLD_BAMBOO, transparent:true, opacity:0.75 });
  var netMat = new THREE.MeshStandardMaterial({ color:0x6f8f5c, transparent:true, opacity:NET_OPACITY, side:THREE.DoubleSide, depthWrite:false, roughness:1 });
  var group = new THREE.Group(), lines = [];
  for (var i = 0; i < pts.length; i++){
    var a = pts[i], b = pts[(i + 1) % pts.length];
    var len = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(len / 1.6));
    for (var k = 0; k <= n; k++){
      var x = a[0] + (b[0] - a[0]) * k / n, z = a[1] + (b[1] - a[1]) * k / n;
      lines.push(x, 0, z, x, top, z);
    }
    for (var y = LOBBY; y <= top; y += FH * 2) lines.push(a[0], y, a[1], b[0], y, b[1]);
    var net = new THREE.Mesh(new THREE.PlaneGeometry(len, top - bottom), netMat);
    net.position.set((a[0] + b[0]) / 2, (top + bottom) / 2, (a[1] + b[1]) / 2);
    net.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]);
    group.add(net);
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(lines, 3));
  group.add(new THREE.LineSegments(geo, poleMat));
  return { group:group, netMat:netMat, poleMat:poleMat };
}
// highest fire intensity a tower has reached up to this point of the timeline
function dashBurnSoFar(id, progress, now){
  var m = now;
  SITE_DATA.timelineEvents.forEach(function(e){ if (e.progress <= progress) m = Math.max(m, (e.towerBurns || {})[id] || 0); });
  return m;
}

function dashRepaintUnits(){
  var mesh = DASH.unitMesh; if (!mesh) return;
  var col = DASH.col, c = new THREE.Color();
  var hu = DASH.hoverUnit >= 0 ? DASH.units[DASH.hoverUnit] : null;
  DASH.units.forEach(function(u, i){
    if (i === DASH.selectedUnit) c.copy(col.select);
    else if (i === DASH.hoverUnit) c.copy(col.hover);
    else {
      c.copy(col.base);
      // small per-flat variation in tone so the facades read as lived-in homes
      { var rj = (((Math.sin(i*12.9898)*43758.5453) % 1) + 1) % 1, rk = (((Math.sin(i*78.233)*12543.17) % 1) + 1) % 1; c.offsetHSL((rk - 0.5) * 0.03, (rj - 0.5) * 0.08, (rj - 0.5) * 0.07); }
      var b = DASH.showFireEffects ? (DASH.towerMeshes[u.tower.id] || {}).burn || 0 : 0;
      if (b > 0) c.lerp(col.ember, Math.min(0.85, b * 0.85));
      if (hu && u.tower === hu.tower && u.floor === hu.floor) c.lerp(col.floor, 0.45);
    }
    mesh.setColorAt(i, c);
  });
  mesh.instanceColor.needsUpdate = true;
}

function dashApplyCut(n){
  DASH.cutFloor = n;
  var zero = new THREE.Matrix4().makeScale(0, 0, 0);
  DASH.units.forEach(function(u, i){ DASH.unitMesh.setMatrixAt(i, u.floor <= n ? DASH.baseMatrices[i] : zero); });
  DASH.coreMeta.forEach(function(c, i){ DASH.coreMesh.setMatrixAt(i, c.floor <= n ? c.m : zero); });
  DASH.unitMesh.instanceMatrix.needsUpdate = true; DASH.coreMesh.instanceMatrix.needsUpdate = true;
  DASH.roofs.forEach(function(r){ r.visible = n === FLOORS; });
  var cut = document.getElementById('dash-cut'); if (cut) cut.value = n;
  var out = document.getElementById('dash-cut-out'); if (out) out.textContent = n + '/F';
}

function dashFocusTower(tw, floor){
  var c = towerCenter(tw);
  DASH.isCinematic = false;
  DASH.camGoal = { target:new THREE.Vector3(c.x, floor ? floorY(floor) : TOWER_TOP*0.55, c.z), radius:95 };
}

/* ---- Sun & sky ----
   The timeline drives a real clock (26 Nov 14:51 → 28 Nov 10:18), so the sun crosses
   the sky and sets twice: the fire's two days and two nights. The compass is set so the
   default view faces south (north is +z, east is -x) and the sun crosses the sky in front of you. */
// timeline progress → hours since 26 Nov 00:00, through the event times
var CLOCK_KEYS = [[0, 14+51/60], [15, 15+34/60], [35, 18+22/60], [65, 24+5+45/60], [85, 24+23+15/60], [100, 48+10+18/60]];
// Hong Kong, late November: sunrise ≈ 06:40, sunset ≈ 17:40, noon elevation ≈ 46°
var SUNRISE = 6+40/60, SUNSET = 17+40/60, SUN_MAX_EL = 46;
var SKY_STOPS = [ // [sun elevation°, sky colour]
  [-14, 0x140e0b], [-4, 0x3b2219], [2, 0x7a4630], [10, 0x96694b], [28, 0x9c8068]

function dashProgressToHours(p){
  for (var i = 1; i < CLOCK_KEYS.length; i++){
    var a = CLOCK_KEYS[i-1], b = CLOCK_KEYS[i];
    if (p <= b[0]) return a[1] + (b[1] - a[1]) * (p - a[0]) / (b[0] - a[0]);
  }
  return CLOCK_KEYS[CLOCK_KEYS.length-1][1];
}
function dashSkyColor(el){
  var c = new THREE.Color(SKY_STOPS[0][1]);
  for (var i = 1; i < SKY_STOPS.length; i++){
    var a = SKY_STOPS[i-1], b = SKY_STOPS[i];
    if (el <= a[0]) break;
    c.set(a[1]).lerp(new THREE.Color(b[1]), Math.min(1, (el - a[0]) / (b[0] - a[0])));
  }

}
function dashGlowSprite(rgb, size){
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d'), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(' + rgb + ',1)'); grad.addColorStop(0.22, 'rgba(' + rgb + ',.95)');
  grad.addColorStop(0.35, 'rgba(' + rgb + ',.35)'); grad.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  var s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), depthWrite:false, fog:false, transparent:true }));

}
// date + clock time at a point on the timeline, e.g. "11月26日 22:09" / "26 Nov 22:09"
function dashClockLabel(progress){
  var h = dashProgressToHours(progress), d = ((h % 24) + 24) % 24, day = 26 + Math.floor(h / 24);
  var hh = Math.floor(d), mm = Math.floor((d - hh) * 60), clock = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  return LANG === 'en' ? day + ' Nov ' + clock : '11月' + day + '日 ' + clock;
}
function dashUpdateSky(progress){
  var hours = dashProgressToHours(progress), d = ((hours % 24) + 24) % 24;
  var t = (d - SUNRISE) / (SUNSET - SUNRISE);                     // 0..1 while the sun is up
  var el = Math.sin(Math.PI * t) * SUN_MAX_EL;                     // negative below the horizon
  var az = (114 + 132 * Math.min(1, Math.max(0, t))) * Math.PI / 180; // ESE → S → WSW
  var elR = el * Math.PI / 180;
  var dir = new THREE.Vector3(-Math.sin(az) * Math.cos(elR), Math.sin(elR), Math.cos(az) * Math.cos(elR));
  var dayFactor = Math.min(1, Math.max(0, (el + 6) / 16));         // 0 at night, 1 in daylight
  DASH.dayFactor = dayFactor;
  var sky = dashSkyColor(el);
  DASH.scene.background.copy(sky); DASH.scene.fog.color.copy(sky);
  DASH.sun.position.copy(dir).multiplyScalar(260);
  DASH.sun.intensity = Math.max(0, Math.sin(elR)) * 1.45;
  DASH.sun.color.set(0xff9a5a).lerp(new THREE.Color(0xffe9cc), Math.min(1, Math.max(0, el / 30)));
  DASH.sunSprite.position.copy(dir).multiplyScalar(520);
  DASH.sunSprite.visible = el > -3;
  DASH.moon.intensity = 0.22 * (1 - dayFactor);
  DASH.moonSprite.position.set(0.35, 0.42, -0.84).multiplyScalar(520);
  DASH.moonSprite.visible = dayFactor < 0.4;
  DASH.hemi.intensity = 0.22 + 0.5 * dayFactor;
  DASH.hemi.color.set(0x6a5560).lerp(new THREE.Color(0xffe4c2), dayFactor);

  // clock readout: date, time and which day/night of the fire this is
  var dayIdx = Math.floor(hours / 24), isDay = d >= SUNRISE && d < SUNSET;
  var nightNo = d < SUNRISE ? dayIdx : dayIdx + 1;
  var hh = Math.floor(d), mm = Math.floor((d - hh) * 60);
  var clock = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  var NUM = ['一','二','三'];
  var label = LANG === 'en'
    ? (26 + dayIdx) + ' Nov 2025 ' + clock + ' · ' + (isDay ? 'Day ' + (dayIdx + 1) : 'Night ' + nightNo)
    : '2025年11月' + (26 + dayIdx) + '日 ' + clock + ' · ' + (isDay ? '第' + NUM[dayIdx] + '日' : '第' + NUM[nightNo - 1] + '夜');
  var el2 = document.getElementById('dash-sky-clock');
  if (el2) el2.innerHTML = '<span class="sky-ico">' + (isDay ? '☀' : '☾') + '</span>' + esc(label);
  return { dayFactor:dayFactor, isDay:isDay };
}

function dashUpdateCamera(){
  var c = DASH;
  c.camera.position.x = c.cameraTarget.x + c.cameraRadius * Math.sin(c.cameraPhi) * Math.cos(c.cameraTheta);
  c.camera.position.y = c.cameraTarget.y + c.cameraRadius * Math.cos(c.cameraPhi);
  c.camera.position.z = c.cameraTarget.z + c.cameraRadius * Math.sin(c.cameraPhi) * Math.sin(c.cameraTheta);
  c.camera.lookAt(c.cameraTarget);
}
function dashResetCamera(){

  DASH.cameraRadius = DEFAULT_CAM.radius; DASH.cameraTheta = DEFAULT_CAM.theta; DASH.cameraPhi = DEFAULT_CAM.phi;
  dashUpdateCamera();

}
function dashInit3D(){

  }
  DASH.scene = new THREE.Scene(); DASH.scene.background = new THREE.Color(0x1c140f); DASH.scene.fog = new THREE.FogExp2(0x1c140f, 0.0029);

  DASH.cameraTarget = new THREE.Vector3(0,0,0); dashUpdateCamera();

  DASH.hemi = new THREE.HemisphereLight(0xffe4c2, 0x2b1d13, 0.85); DASH.scene.add(DASH.hemi);
  var dl = new THREE.DirectionalLight(0xffc98e, 1.05); dl.position.set(130,120,45); dl.castShadow = true;
  dl.shadow.mapSize.width = 2048; dl.shadow.mapSize.height = 2048;
  Object.assign(dl.shadow.camera, { left:-150, right:150, top:150, bottom:-150, near:10, far:600 });
  DASH.scene.add(dl); DASH.sun = dl;
  DASH.moon = new THREE.DirectionalLight(0xcfc3d6, 0); DASH.moon.position.set(70,150,-150); DASH.scene.add(DASH.moon);
  DASH.sunSprite = dashGlowSprite('255,214,150', 70); DASH.scene.add(DASH.sunSprite);
  DASH.moonSprite = dashGlowSprite('236,228,214', 26); DASH.scene.add(DASH.moonSprite);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(6000,6000), new THREE.MeshStandardMaterial({ color:0x261b14, roughness:0.95 }));
  ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; DASH.scene.add(ground);
  var grid = new THREE.GridHelper(600, 60, 0x4a3727, 0x30231a); grid.position.y = 0.05; DASH.scene.add(grid);
  dashBuildEstate();
  dashSetupInteraction(container);
  window.addEventListener('resize', dashOnResize);
  DASH.inited = true;
  dashAnimate();
  dashUpdateTimeline(0);
}
function dashOnResize(){
  var container = document.getElementById('dash-canvas-container');
  if (!container || !DASH.camera) return;
  DASH.camera.aspect = container.clientWidth/container.clientHeight; DASH.camera.updateProjectionMatrix();
  DASH.renderer.setSize(container.clientWidth, container.clientHeight);
  dashFxResize();
}
function dashAnimate(){
  requestAnimationFrame(dashAnimate);
  if (!document.body.classList.contains('mode-3d') || !DASH.renderer) return;
  if (DASH.story && DASH.story.active) dashStoryFrame();
  if (DASH.camGoal && !DASH.isCinematic){
    DASH.cameraTarget.lerp(DASH.camGoal.target, 0.08);
    DASH.cameraRadius += (DASH.camGoal.radius - DASH.cameraRadius) * 0.08;
    if (DASH.cameraTarget.distanceTo(DASH.camGoal.target) < 0.05 && Math.abs(DASH.camGoal.radius - DASH.cameraRadius) < 0.05) DASH.camGoal = null;
    dashUpdateCamera();
  }
  var now = performance.now(), dt = Math.min(0.05, (now - (DASH.lastFrame || now)) / 1000); DASH.lastFrame = now;
  dashUpdateFx(dt, now / 1000);

}
function dashCinematicCamera(progress){
  var f = SITE_DATA.towers.filter(function(tw){return tw.id==='F';})[0]; if (!f) return;
  var c = towerCenter(f), focusTarget = new THREE.Vector3(c.x, TOWER_TOP/2, c.z);
  var zoomP = Math.min(progress/55, 1), rotP = Math.max(0, (progress-55)/45);
  DASH.camGoal = null;
  DASH.cameraTarget = focusTarget.clone().lerp(new THREE.Vector3(0,0,0), zoomP);
  DASH.cameraRadius = 60 + (DEFAULT_CAM.radius-60)*zoomP;
  DASH.cameraTheta = DEFAULT_CAM.theta + Math.PI*rotP;
  DASH.cameraPhi = DEFAULT_CAM.phi;
  dashUpdateCamera();
}
function dashUpdateTimeline(progress){
  if (DASH.isCinematic) dashCinematicCamera(progress);
  var events = SITE_DATA.timelineEvents, idx = 0;
  for (var i=events.length-1;i>=0;i--){ if (progress >= events[i].progress){ idx = i; break; } }
  var current = events[idx], next = events[idx+1];
  // fraction of the way to the next event, so fire intensity fades smoothly
  var segT = next ? (progress - current.progress) / (next.progress - current.progress) : 0;
  var nextBurns = (next && next.towerBurns) || current.towerBurns || {};
  var elTs = document.getElementById('dash-current-timestamp'); if (elTs) elTs.textContent = current.timeStr + ' · ' + tr(current.stage);
  var elTt = document.getElementById('dash-detail-time'); if (elTt) elTt.textContent = current.timeStr;
  var elSt = document.getElementById('dash-detail-stage'); if (elSt) elSt.textContent = tr(current.stage);
  var elTi = document.getElementById('dash-detail-title'); if (elTi) elTi.textContent = tr(current.title);
  var elDe = document.getElementById('dash-detail-desc'); if (elDe) elDe.textContent = tr(current.desc);
  var elLo = document.getElementById('dash-m-location'); if (elLo) elLo.textContent = tr(current.location);
  var elSp = document.getElementById('dash-m-spread'); if (elSp) elSp.textContent = tr(current.spread);
  var elFi = document.getElementById('dash-m-finding'); if (elFi) elFi.textContent = tr(current.finding);
  var sky = dashUpdateSky(progress);
  var burns = current.towerBurns || {};
  SITE_DATA.towers.forEach(function(tw){
    var m = DASH.towerMeshes[tw.id]; if (!m) return;
    var v0 = burns[tw.id] || 0, v1 = nextBurns[tw.id] || 0;
    var v = v0 + (v1 - v0) * segT;
    m.burn = v;
    if (DASH.showFireEffects && v > 0){
      m.lightBase = v * (0.5 + 2.2 * (1 - sky.dayFactor));
    } else { m.lightBase = 0; m.light.intensity = 0; }
    // the netting burns away (and the bamboo chars) once the fire has reached a tower
    var burned = dashBurnSoFar(tw.id, progress, v), gone = DASH.showFireEffects ? Math.min(1, burned * 1.3) : 0;
    m.netMat.opacity = NET_OPACITY * (1 - gone);
    m.poleMat.color.set(SCAFFOLD_BAMBOO).lerp(new THREE.Color(SCAFFOLD_CHAR), gone);
    m.poleMat.opacity = 0.75 * (1 - 0.45 * gone);
    var badge = document.getElementById('dash-badge-'+tw.id);
    if (badge){
      if (tw.id === SITE_DATA.meta.sparedTower){ badge.textContent = t('badgeSpared'); badge.className = 'dash-badge b-spared'; }
      else if (v >= 0.8){ badge.textContent = t('badgeSevere'); badge.className = 'dash-badge b-severe'; }
      else if (v > 0.2){ badge.textContent = t('badgeSpread'); badge.className = 'dash-badge b-spread'; }
      else if (v > 0){ badge.textContent = t('badgeLight'); badge.className = 'dash-badge b-light'; }
      else if (burned > 0){ badge.textContent = t('badgeOut'); badge.className = 'dash-badge'; }
      else { badge.textContent = t('badgeNone'); badge.className = 'dash-badge'; }
    }
  });
  document.querySelectorAll('.dash-stage-btn').forEach(function(b, k){ b.classList.toggle('active', k === idx); });
  dashRepaintUnits();
}

function dashPick(e){
  var container = document.getElementById('dash-canvas-container');
  if (!container || !DASH.unitMesh) return -1;
  var rect = container.getBoundingClientRect();
  DASH.mouse.x = ((e.clientX-rect.left)/rect.width)*2-1; DASH.mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  DASH.raycaster.setFromCamera(DASH.mouse, DASH.camera);
  var hit = DASH.raycaster.intersectObject(DASH.unitMesh)[0];
  return hit ? hit.instanceId : -1;
}
function dashSetupInteraction(container){
  var clickStart = {x:0,y:0};
  var pointers = new Map(), lastPinch = 0;
  function pinchDist(){ var p = Array.from(pointers.values()); return Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); }
  container.addEventListener('pointerdown', function(e){
    if (DASH.story && DASH.story.active) return;   // scrolling drives the camera during the tour
    dashDismissGuide(); DASH.isCinematic = false; DASH.camGoal = null; DASH.isMouseDown = true;
    container.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    if (pointers.size === 2) lastPinch = pinchDist();
    clickStart = {x:e.clientX,y:e.clientY}; DASH.prevMouse = {x:e.clientX,y:e.clientY};
  });
  container.addEventListener('pointermove', function(e){
    if (DASH.story && DASH.story.active) return;
    if (e.pointerType === 'mouse' && !pointers.size) dashHover(e);
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
    dashHideHover();
    if (pointers.size === 2){
      var d = pinchDist();
      DASH.cameraRadius = Math.max(18, Math.min(260, DASH.cameraRadius - (d-lastPinch)*0.5));
      lastPinch = d; dashUpdateCamera(); return;
    }

    DASH.cameraTheta -= dx*0.008; DASH.cameraPhi -= dy*0.008;
    DASH.cameraPhi = Math.max(0.1, Math.min(Math.PI/2-0.05, DASH.cameraPhi));
    DASH.prevMouse = {x:e.clientX,y:e.clientY}; dashUpdateCamera();
  });
  container.addEventListener('pointerleave', function(){
    dashHideHover();
    if (DASH.hoverUnit >= 0){ DASH.hoverUnit = -1; dashRepaintUnits(); }
  });
  function endPointer(e){
    if (!pointers.has(e.pointerId)) return;
    var single = pointers.size === 1;
    pointers.delete(e.pointerId);
    if (pointers.size){ var rest = Array.from(pointers.values())[0]; DASH.prevMouse = {x:rest.x,y:rest.y}; return; }
    DASH.isMouseDown = false;
    if (e.type === 'pointercancel' || !single) return;
    // a click (not a drag) that started on the canvas opens the flat under the cursor
    if (Math.abs(e.clientX-clickStart.x) < 5 && Math.abs(e.clientY-clickStart.y) < 5){
      var i = dashPick(e);
      if (i >= 0) dashOpenUnit(i);
    }
  }
  container.addEventListener('pointerup', endPointer);
  container.addEventListener('pointercancel', endPointer);
  container.addEventListener('wheel', function(e){
    if (DASH.story && DASH.story.active) return;
    e.preventDefault();
    DASH.isCinematic = false; DASH.camGoal = null;
    DASH.cameraRadius = Math.max(18, Math.min(260, DASH.cameraRadius * (1 + e.deltaY*0.0012)));
    dashUpdateCamera();
  }, { passive:false });
}
function dashHideHover(){
  var card = document.getElementById('dash-tower-hover-label'); if (card) card.style.display = 'none';
}
function dashHover(e){

  if (container) container.style.cursor = i >= 0 ? 'pointer' : 'grab';
  if (i < 0 || !card){ dashHideHover(); return; }
  var u = DASH.units[i];
  var own = u.media.filter(function(m){ return m.level === 'unit' || m.level === 'floor'; }).length;
  card.innerHTML = '<strong>' + esc(unitName(u)) + '</strong><small class="tabular">' + esc(u.key) + '</small>'
    + '<small class="' + (own ? 'has' : '') + '">' + (own ? '● ' + own + ' ' + esc(t('unitOwnCount')) : esc(t('unitNoOwn'))) + ' · ' + esc(t('unitClickOpen')) + '</small>';

function dashSearchUnit(q){

/* ---- Scroll-driven tour ----
   On arrival every panel is hidden; scrolling (wheel, swipe or arrow keys) walks through the
   six time points while the camera, fire and daylight follow. One more scroll after the last
   point hands over to the full interactive view and the panels come back. */
var STORY_END = 5, STORY_EXIT = 5.5;
// one camera shot per time point: [target x, y, z, radius, theta, phi], placed relative to the
// towers on the block plan. Daytime shots look from the sunlit south-west; night shots circle round.
function dashStoryShots(){
  if (DASH.storyShots) return DASH.storyShots;
  var c = function(id){ return towerCenter(SITE_DATA.towers.filter(function(t){ return t.id === id; })[0]); };
  var F = c('F'), G = c('G'), E = c('E');   // 宏昌閣, 宏盛閣, 宏泰閣
  var mid = F.clone().add(G).add(E).divideScalar(3);
  return DASH.storyShots = [
    [F.x, 40, F.z, 106.7, -1.10, 1.752],   // 14:51 — fire starts at the foot of 宏昌閣 (camera low, looking up)

/* ---- Fire, sparks and smoke ----
   Soft sprite particles instead of solid shapes: flames lick up the burning facades and cool
   from white-yellow to deep red, sparks rise higher, and dark smoke billows and drifts downwind
   (the wind carried it from 宏昌閣 toward 宏泰閣 and 宏盛閣). */
var FX_FIRE_MAX = 3200, FX_SMOKE_MAX = 900;
var FX_WIND = new THREE.Vector3(0.8, 0, 0.6).normalize();   // from 宏昌閣 toward 宏泰閣 (west) and 宏盛閣 (north)
var FX_VERT = [
  'attribute vec3 pcolor; attribute float psize; attribute float palpha;',
  'uniform float scale; varying vec3 vC; varying float vA;',
  'void main(){ vC = pcolor; vA = palpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);',
  '  gl_PointSize = psize * scale / max(1.0, -mv.z); gl_Position = projectionMatrix * mv; }'

var FX_FRAG = [

  'void main(){ vec4 t = texture2D(map, gl_PointCoord); float a = t.a * vA; if (a < 0.003) discard;',
  '  gl_FragColor = vec4(vC * t.rgb, a); }'

function dashFxTexture(kind){
  var c = document.createElement('canvas'); c.width = c.height = 128;
  var g = c.getContext('2d');

    var gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,240,210,.9)');
    gr.addColorStop(0.45, 'rgba(255,200,140,.38)'); gr.addColorStop(1, 'rgba(255,160,80,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  } else {
    // billowy smoke: overlapping soft puffs inside a round falloff
    for (var i = 0; i < 9; i++){
      var x = 64 + (Math.random() - 0.5) * 50, y = 64 + (Math.random() - 0.5) * 50, r = 26 + Math.random() * 24;
      var p = g.createRadialGradient(x, y, 0, x, y, r);
      p.addColorStop(0, 'rgba(255,255,255,.42)'); p.addColorStop(1, 'rgba(255,255,255,0)');

function dashFxSystem(max, tex, blending, order){

    pos:new Float32Array(max * 3), col:new Float32Array(max * 3), size:new Float32Array(max), alpha:new Float32Array(max),

    s0:new Float32Array(max), s1:new Float32Array(max), kind:new Uint8Array(max), str:new Float32Array(max) };

function dashFxSpawn(sys, x, y, z, vx, vy, vz, ttl, s0, s1, kind, str){
  if (sys.n >= sys.max) return;

function dashFxKill(sys, i){

  sys.life[i] = sys.life[j]; sys.ttl[i] = sys.ttl[j]; sys.s0[i] = sys.s0[j]; sys.s1[i] = sys.s1[j]; sys.kind[i] = sys.kind[j]; sys.str[i] = sys.str[j];

function dashInitFx(){
  DASH.fire = dashFxSystem(FX_FIRE_MAX, dashFxTexture('flame'), THREE.AdditiveBlending, 3);
  DASH.smoke = dashFxSystem(FX_SMOKE_MAX, dashFxTexture('smoke'), THREE.NormalBlending, 2);
  DASH.scene.add(DASH.smoke.points); DASH.scene.add(DASH.fire.points);
  // the facade outline (just outside the scaffold) where flames appear
  var w = ARM_W/2 + 1.1, e = CORE/2 + ARM_L + 1.1;
  var pts = [[-w,e],[w,e],[w,w],[e,w],[e,-w],[w,-w],[w,-e],[-w,-e],[-w,-w],[-e,-w],[-e,w],[-w,w]];

  for (var i = 0; i < pts.length; i++){
    var a = pts[i], b = pts[(i + 1) % pts.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);

  }

function dashFxResize(){

  var scale = h / (2 * Math.tan(DASH.camera.fov * Math.PI / 360));

}
function dashFxPointOn(tw, y){
  var d = Math.random() * DASH.fxPerimeter, e = DASH.fxEdges[0];
  for (var i = 0; i < DASH.fxEdges.length; i++){ if (d <= DASH.fxEdges[i].at + DASH.fxEdges[i].len){ e = DASH.fxEdges[i]; break; } }
  var f = (d - e.at) / e.len;

}
function dashUpdateFx(dt, time){
  if (!DASH.fire) return;
  var fire = DASH.fire, smoke = DASH.smoke, night = 1 - (DASH.dayFactor == null ? 1 : DASH.dayFactor);
  var on = DASH.showFireEffects;
  // spawn from every burning tower, in proportion to how hard it is burning
  SITE_DATA.towers.forEach(function(tw, ti){
    var m = DASH.towerMeshes[tw.id]; if (!m) return;
    m.light.intensity = m.lightBase * (0.82 + 0.18 * Math.sin(time * 13 + ti * 3) * Math.sin(time * 7.3 + ti));
    var v = on ? m.burn : 0; if (v <= 0.02) return;

    var acc = DASH.fxAcc[tw.id] || { f:0, s:0 };
    acc.f += dt * v * 520; acc.s += dt * v * 34;

      acc.f--;

        dashFxSpawn(fire, p.x, p.y, p.z, (Math.random() - 0.5) * 2 + FX_WIND.x * 2, 6 + Math.random() * 6, (Math.random() - 0.5) * 2 + FX_WIND.z * 2,
          1.6 + Math.random() * 1.6, 0.9 + Math.random() * 0.7, 0.9, 1, v);
      } else {                     // flame tongue
        var s0 = (3 + Math.random() * 4) * (0.6 + v * 0.6);
        dashFxSpawn(fire, p.x, p.y, p.z, (Math.random() - 0.5) * 0.8 + FX_WIND.x * 1.2, 3 + Math.random() * 4, (Math.random() - 0.5) * 0.8 + FX_WIND.z * 1.2,
          0.45 + Math.random() * 0.8, s0, s0 * 0.4, 0, v);
      }
    }
    while (acc.s >= 1){
      acc.s--;
      var q = dashFxPointOn(tw, top * (0.55 + Math.random() * 0.45) + 2);
      var sz = 10 + Math.random() * 9;
      dashFxSpawn(smoke, q.x, q.y, q.z, FX_WIND.x * (2 + Math.random() * 2), 2.5 + Math.random() * 2, FX_WIND.z * (2 + Math.random() * 2),

  for (var i = fire.n - 1; i >= 0; i--){
    fire.life[i] += dt;
    if (fire.life[i] >= fire.ttl[i] || !on){ dashFxKill(fire, i); continue; }
    var k = i * 3;
    fire.vel[k+1] += (fire.kind[i] ? -1.5 : 2.2) * dt;                               // flames are buoyant, sparks arc
    fire.vel[k] += Math.sin(time * 9 + i) * 3 * dt; fire.vel[k+2] += Math.cos(time * 8 + i * 1.7) * 3 * dt;   // flicker

      else if (tt < 0.7){ var u2 = (tt - 0.25) / 0.45; r = 1 - 0.15 * u2; gg = 0.6 - 0.38 * u2; b = 0.18 - 0.13 * u2; }   // orange

    smoke.size[n2] = smoke.s0[n2] + (smoke.s1[n2] - smoke.s0[n2]) * Math.sqrt(st);
  }
  [fire, smoke].forEach(function(sys){
    sys.geo.setDrawRange(0, sys.n);
    ['position','pcolor','psize','palpha'].forEach(function(k){ sys.geo.attributes[k].needsUpdate = true; });
  });
}
